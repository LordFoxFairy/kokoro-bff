components:
  securitySchemes:
    serviceHeader:
      type: apiKey
      in: header
      name: x-kokoro-service
    internalSecret:
      type: apiKey
      in: header
      name: x-kokoro-internal-secret
    namespace:
      type: apiKey
      in: header
      name: x-kokoro-namespace
    principalId:
      type: apiKey
      in: header
      name: x-kokoro-principal-id
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Opaque chat session identifier.
      schema:
        type: string
        minLength: 1
      example: session_kokoro
    RunId:
      name: runId
      in: path
      required: true
      description: Opaque asynchronous run identifier.
      schema:
        type: string
        minLength: 1
      example: run_01JASYNC
    ShareId:
      name: shareId
      in: path
      required: true
      description: Opaque public session share identifier.
      schema:
        type: string
        minLength: 1
      example: shr_01JSHARE
    ScopeQuery:
      name: scope
      in: query
      required: false
      description: Optional server-derived scope filter; it cannot override authenticated identity.
      schema:
        type: string
        minLength: 1
      example: ns_test
    ProjectRefQuery:
      name: project_ref
      in: query
      required: false
      description: Filter sessions to a project reference.
      schema:
        type: string
        minLength: 1
      example: project_kokoro
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of sessions to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        $ref: '#/components/schemas/Cursor'
      example: cur_01JNEXT
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last delivered event sequence; the stream resumes strictly after this cursor.
      schema:
        $ref: '#/components/schemas/EventCursor'
      example: 4
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    MoriProjectRef:
      name: projectRef
      in: path
      required: true
      description: Opaque Mori music project reference.
      schema:
        type: string
        minLength: 1
      example: project_preview_first_light
    MoriGenerationRef:
      name: generationRef
      in: path
      required: true
      description: Opaque Mori generation reference.
      schema:
        type: string
        minLength: 1
      example: generation_mori_1
    MoriLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Mori generation event cursor; the stream resumes strictly after this id.
      schema:
        type: string
      example: generation_mori_1:2
    MoriCandidateRef:
      name: candidateRef
      in: path
      required: true
      description: Opaque Mori candidate reference.
      schema:
        type: string
        minLength: 1
      example: candidate_preview_first_light_a
    MoriVersionRef:
      name: versionRef
      in: path
      required: true
      description: Opaque immutable Mori version reference.
      schema:
        type: string
        minLength: 1
      example: version_preview_first_light_a
    MoriExportRef:
      name: exportRef
      in: path
      required: true
      description: Opaque Mori export reference.
      schema:
        type: string
        minLength: 1
      example: export_mori_1
    SkillName:
      name: skill
      in: path
      required: true
      schema:
        type: string
    SkillNameOnly:
      name: name
      in: path
      required: true
      schema:
        type: string
    SkillScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
    McpServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ScheduledTaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Platform:
      name: platform
      in: query
      required: true
      schema:
        type: string
        enum: [telegram, line, slack]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 256
      description: Request correlation identifier echoed by every v1 envelope.
      example: req_01JASYNC000000000000000000
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination cursor. Clients must not parse or construct it.
      example: cur_01JNEXT000000000000000000
    EventCursor:
      type: integer
      minimum: 0
      description: Monotonic session event sequence used by Last-Event-ID.
      example: 4
    RequestMeta:
      type: object
      required: [request_id]
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
      example:
        request_id: req_01JASYNC000000000000000000
    ErrorDetail:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          example: session_not_found
        message:
          type: string
          minLength: 1
          example: Session was not found
    ErrorEnvelope:
      type: object
      required: [error, meta]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        error:
          code: session_not_found
          message: Session was not found
        meta:
          request_id: req_01JASYNC000000000000000000
    ChatSessionSummary:
      type: object
      required: [session_id, title, updated_at]
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        title: { type: string }
        updated_at: { type: string, format: date-time }
      example:
        session_id: session_kokoro
        title: Review business API contract
        updated_at: '2026-01-01T00:00:00.000Z'
    SessionListResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [sessions, next_cursor]
          additionalProperties: false
          properties:
            sessions:
              type: array
              items: { $ref: '#/components/schemas/ChatSessionSummary' }
            next_cursor:
              type: [string, 'null']
              description: Opaque cursor for the next page; null means there is no next page.
              example: null
        meta: { $ref: '#/components/schemas/RequestMeta' }
    SessionMessageListResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [messages, next_cursor]
          additionalProperties: false
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/ChatMessage' }
            next_cursor:
              type: [string, 'null']
              description: Opaque cursor for the next page; null means there is no next page.
              example: null
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        data:
          messages: []
