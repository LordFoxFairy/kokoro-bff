        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    serviceHeader:
      type: apiKey
      in: header
      name: x-kokoro-service
    internalSecret:
      type: apiKey
      in: header
      name: x-kokoro-internal-secret
    namespace:
      type: apiKey
      in: header
      name: x-kokoro-namespace
    principalId:
      type: apiKey
      in: header
      name: x-kokoro-principal-id
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Opaque chat session identifier.
      schema:
        type: string
        minLength: 1
      example: session_kokoro
    RunId:
      name: runId
      in: path
      required: true
      description: Opaque asynchronous run identifier.
      schema:
        type: string
        minLength: 1
      example: run_01JASYNC
    ShareId:
      name: shareId
      in: path
      required: true
      description: Opaque public session share identifier.
      schema:
        type: string
        minLength: 1
      example: shr_01JSHARE
    ScopeQuery:
      name: scope
      in: query
      required: false
      description: Optional server-derived scope filter; it cannot override authenticated identity.
      schema:
        type: string
        minLength: 1
      example: ns_test
    ProjectRefQuery:
      name: project_ref
      in: query
      required: false
      description: Filter sessions to a project reference.
      schema:
        type: string
        minLength: 1
      example: project_kokoro
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of sessions to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        $ref: '#/components/schemas/Cursor'
      example: cur_01JNEXT
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last delivered event sequence; the stream resumes strictly after this cursor.
      schema:
        $ref: '#/components/schemas/EventCursor'
      example: 4
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    SkillName:
      name: skill
      in: path
      required: true
      schema:
        type: string
    SkillNameOnly:
      name: name
      in: path
      required: true
      schema:
        type: string
    SkillScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
    McpServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ScheduledTaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Platform:
      name: platform
      in: query
      required: true
      schema:
        type: string
        enum: [telegram, line, slack]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 256
      description: Request correlation identifier echoed by every v1 envelope.
      example: req_01JASYNC000000000000000000
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination cursor. Clients must not parse or construct it.
      example: cur_01JNEXT000000000000000000
    EventCursor:
      type: integer
      minimum: 0
      description: Monotonic session event sequence used by Last-Event-ID.
      example: 4
    RequestMeta:
      type: object
      required: [request_id]
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
      example:
        request_id: req_01JASYNC000000000000000000
    ErrorDetail:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          example: session_not_found
        message:
          type: string
          minLength: 1
          example: Session was not found
    ErrorEnvelope:
      type: object
      required: [error, meta]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        error:
          code: session_not_found
          message: Session was not found
        meta:
          request_id: req_01JASYNC000000000000000000
    ChatSessionSummary:
      type: object
      required: [session_id, title, updated_at]
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        title: { type: string }
        updated_at: { type: string, format: date-time }
      example:
        session_id: session_kokoro
        title: Review business API contract
        updated_at: '2026-01-01T00:00:00.000Z'
    SessionListResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [sessions, next_cursor]
          additionalProperties: false
          properties:
            sessions:
              type: array
              items: { $ref: '#/components/schemas/ChatSessionSummary' }
            next_cursor:
              type: [string, 'null']
              description: Opaque cursor for the next page; null means there is no next page.
              example: null
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        data:
          sessions:
            - session_id: session_kokoro
              title: Review business API contract
              updated_at: '2026-01-01T00:00:00.000Z'
          next_cursor: null
        meta:
          request_id: req_01JASYNC000000000000000000
    ChatSession:
      type: object
      required: [session_id, title, owner_id, created_at, updated_at]
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        title: { type: string }
        owner_id: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example:
        session_id: session_kokoro
        title: Review business API contract
        owner_id: ns_test
        created_at: '2026-01-01T00:00:00.000Z'
        updated_at: '2026-01-01T00:00:00.000Z'
    ChatMessage:
      type: object
      required: [message_id, role, content, status, created_at]
      additionalProperties: false
      properties:
        message_id: { type: string, minLength: 1 }
        role:
          type: string
          enum: [user, assistant, system]
        content: { type: string }
        status:
          type: string
          enum: [pending, streaming, completed, failed]
        created_at: { type: string, format: date-time }
        run_id: { type: string }
      example:
        message_id: msg_01JUSER
        role: user
        content: Review the contract
        status: completed
        created_at: '2026-01-01T00:00:00.000Z'
        run_id: run_01JASYNC
    ChatRun:
      type: object
      required: [run_id, status]
      additionalProperties: false
      properties:
        run_id: { type: string, minLength: 1 }
        status:
          type: string
          enum: [running, completed, cancelled, failed, waiting]
      example:
        run_id: run_01JASYNC
        status: running
    SessionSnapshotResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [session, pending_pauses, files, deliveries, event_watermark]
          additionalProperties: false
          properties:
            session: { $ref: '#/components/schemas/ChatSession' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/ChatMessage' }
            active_run: { $ref: '#/components/schemas/ChatRun' }
            pending_pauses:
              type: array
              items:
                type: object
                additionalProperties: true
            files:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceFile' }
            deliveries:
              type: array
              items: { $ref: '#/components/schemas/Delivery' }
            event_watermark: { $ref: '#/components/schemas/EventCursor' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        data:
          session:
            session_id: session_kokoro
            title: Review business API contract
            owner_id: ns_test
            created_at: '2026-01-01T00:00:00.000Z'
            updated_at: '2026-01-01T00:00:00.000Z'
          messages: []
          active_run:
            run_id: run_01JASYNC
            status: running
          pending_pauses: []
          files: []
          deliveries: []
          event_watermark: 4
        meta:
          request_id: req_01JASYNC000000000000000000
    WorkspaceFile:
      type: object
      required: [path, mime, bytes]
      additionalProperties: false
      properties:
        path: { type: string }
        mime: { type: string }
        bytes: { type: integer, minimum: 0 }
    Delivery:
      type: object
      required: [content_hash, path, title, mime, size, run_id, created_at]
      additionalProperties: false
      properties:
        content_hash: { type: string }
        path: { type: string }
        title: { type: string }
        mime: { type: string }
        size: { type: integer, minimum: 0 }
        run_id: { type: string }
        created_at: { type: string, format: date-time }
    MessageCreateRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 100000
        model: { type: string, minLength: 1 }
        agent: { type: string, minLength: 1 }
        thinking: { type: boolean }
        pinned_skills:
          type: array
          items: { type: string, minLength: 1 }
        mcp_servers:
          type: array
          items: { type: string, minLength: 1 }
        project_ref: { type: string, minLength: 1 }
      example:
        content: Review the latest project changes.
        model: default
        project_ref: project_kokoro
    MessageReceipt:
      type: object
      required: [run_id, user_message_id, assistant_message_id]
      additionalProperties: false
      properties:
        run_id: { type: string, minLength: 1 }
        user_message_id: { type: string, minLength: 1 }
        assistant_message_id: { type: string, minLength: 1 }
      example:
        run_id: run_01JASYNC
        user_message_id: msg_01JUSER
        assistant_message_id: msg_01JASSISTANT
    MessageReceiptResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/MessageReceipt' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        data:
          run_id: run_01JASYNC
          user_message_id: msg_01JUSER
          assistant_message_id: msg_01JASSISTANT
        meta:
          request_id: req_01JASYNC000000000000000000
    RunCancelRequest:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, const: run.cancel }
      example:
        kind: run.cancel
    RunResumeRequest:
      type: object
      required: [kind, decisions]
      additionalProperties: false
      properties:
        kind: { type: string, const: run.resume }
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
      example:
        kind: run.resume
        decisions:
          - type: approve
            tool_id: tool_01J
    RunSteerRequest:
      type: object
      required: [kind, message_id, content]
      additionalProperties: false
      properties:
        kind: { type: string, const: run.steer }
        message_id: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
      example:
        kind: run.steer
        message_id: msg_01JASSISTANT
        content: Focus on the API contract.
    RunControlRequest:
      oneOf:
        - $ref: '#/components/schemas/RunCancelRequest'
        - $ref: '#/components/schemas/RunResumeRequest'
        - $ref: '#/components/schemas/RunSteerRequest'
      discriminator:
        propertyName: kind
      examples:
        - kind: run.cancel
        - kind: run.resume
          decisions:
            - type: approve
              tool_id: tool_01J
    ControlReceipt:
      type: object
      required: [run_id, command_id, request_digest, status, replayed]
      additionalProperties: false
      properties:
        run_id: { type: string, minLength: 1 }
        command_id: { type: string, minLength: 1 }
        request_digest: { type: string, minLength: 1 }
        status: { type: string, enum: [pending, succeeded, failed] }
        error_code: { type: [string, 'null'] }
        replayed: { type: boolean }
      example:
        run_id: run_01JASYNC
        command_id: command_01J
        request_digest: sha256:abc123
        status: pending
        replayed: false
    ControlReceiptResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/ControlReceipt' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        data:
          run_id: run_01JASYNC
          command_id: command_01J
          request_digest: sha256:abc123
          status: pending
          replayed: false
        meta:
          request_id: req_01JASYNC000000000000000000
    SessionEventStream:
      type: string
      description: Newline-delimited server-sent event frames. The event id is the resume cursor.
      example: |-
        id: 4
        event: run.completed
        data: {"event_id":"event_4","seq":4,"session_id":"session_kokoro","run_id":"run_01JASYNC","kind":"run.completed","timestamp":"2026-01-01T00:00:04.000Z","payload":{"status":"completed"}}
    RenameSessionRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
      example:
        title: Contract review
    DeleteSessionResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status: { type: string, const: deleted }
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        data:
          status: deleted
        meta:
          request_id: req_01JASYNC000000000000000000
    ShareReceipt:
      type: object
      required: [share_id]
      additionalProperties: false
      properties:
        share_id: { type: string, minLength: 1 }
      example:
        share_id: shr_01JSHARE
    ShareReceiptResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/ShareReceipt' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        data:
          share_id: shr_01JSHARE
        meta:
          request_id: req_01JASYNC000000000000000000
    HealthResponse:
      type: object
      required: [status, service, mode]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: kokoro-bff
        mode:
          type: string
          enum: [mock, live]
    Project:
      type: object
      required: [id, name, slug, description, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        instruction: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [projects]
          properties:
            projects:
              type: array
              items: { $ref: '#/components/schemas/Project' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ProjectResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [project]
          properties:
            project: { $ref: '#/components/schemas/Project' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    Task:
      type: object
      required: [id, project_id, title, status, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [todo, in_progress, done]
        updated_at: { type: string, format: date-time }
    TaskListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [tasks]
          properties:
            tasks:
              type: array
              items: { $ref: '#/components/schemas/Task' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ProjectInstructionRevision:
      type: object
      required: [id, instruction, updatedAt, actorName, current]
      properties:
        id: { type: string }
        instruction: { type: string }
        updatedAt: { type: integer, format: int64 }
        actorName: { type: string }
        current: { type: boolean }
    ProjectInstructionRevisionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectInstructionRevision' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
    UpdateProjectInstructionRequest:
      type: object
      required: [instruction]
      additionalProperties: false
      properties:
        instruction: { type: string }
    ProjectSkillRequest:
      type: object
