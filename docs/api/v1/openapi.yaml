openapi: 3.1.0
info:
  title: Kokoro Business API
  version: 1.0.0
  description: Kokoro BFF 面向 Web 的业务契约；阶段 1 仅通过 PostgreSQL + Redis 及显式 HTTP upstream/adapter 契约协作，不新增 MySQL/Mongo 依赖。
servers:
  - url: http://127.0.0.1:4300
    description: Local mock BFF
  - url: https://bff.example.com
    description: Production placeholder
security:
  - serviceHeader: []
    internalSecret: []
    namespace: []
    principalId: []
tags:
  - name: Health
  - name: System
  - name: Projects
  - name: Chat
  - name: Models
  - name: Skills
  - name: MCP
  - name: Scheduled
  - name: Agents
  - name: Library
  - name: Billing
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Required upstreams are not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/system/runtime-manifest:
    get:
      tags: [System]
      operationId: getRuntimeManifest
      description: Resolves the configured host through IAM, loads the System owner manifest, and projects its resource fields once into the BFF v1 snake_case transport.
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: locale
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: surface_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: IAM-derived tenant runtime manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeManifestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '502':
          description: IAM or System owner transport/contract failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: IAM/System owner is not configured or unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/sessions:
    get:
      tags: [Chat]
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      parameters:
        - name: feature_key
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tenant-visible model candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCandidateListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: getSessionSnapshot
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshotResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chat]
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Delete receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chat]
      operationId: createMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      responses:
        '202':
          description: Message receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: streamSessionEvents
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Session event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/runs/{runId}/control:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Chat]
      operationId: controlRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunControlRequest'
      responses:
        '200':
          description: Run control receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/title:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      tags: [Chat]
      operationId: renameSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
      responses:
        '200':
          description: Rename receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/share:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chat]
      operationId: createShare
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Share receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareReceiptResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Chat]
      operationId: revokeShare
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Share receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareReceiptResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/shared/{shareId}:
    parameters:
      - $ref: '#/components/parameters/ShareId'
    get:
      tags: [Chat]
      operationId: getSharedSessionSnapshot
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Shared session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshotResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
    post:
      tags: [Projects]
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      responses:
        '200':
          description: Project projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProjectInstruction
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInstructionRequest'
      responses:
        '200':
          description: Updated project projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectTasks
      responses:
        '200':
          description: Project task projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects/{projectId}/instruction-revisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectInstructionRevisions
      responses:
        '200':
          description: Instruction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInstructionRevisionResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects/{projectId}/resources:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: uploadProjectResources
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Resource request accepted by the BFF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}/skills/{skill}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SkillName'
    patch:
      tags: [Projects]
      operationId: updateProjectSkill
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSkillRequest'
      responses:
        '200':
          description: Project skill state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSkillResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}/scheduled-tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: createProjectScheduledTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledTaskRequest'
      responses:
        '200':
          description: Project scheduled task projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/skills:
    get:
      tags: [Skills]
      operationId: listSkills
      responses:
        '200':
          description: Skill projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/pool:
    get:
      tags: [Skills]
      operationId: listSkillPool
      responses:
        '200':
          description: Skill pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPoolResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/catalog:
    get:
      tags: [Skills]
      operationId: listSkillCatalog
      responses:
        '200':
          description: Skill catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCatalogResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/quota:
    get:
      tags: [Skills]
      operationId: getSkillQuota
      responses:
        '200':
          description: Skill quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillQuotaResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/{name}/revisions:
    parameters:
      - $ref: '#/components/parameters/SkillNameOnly'
      - $ref: '#/components/parameters/SkillScope'
    get:
      tags: [Skills]
      operationId: listSkillRevisions
      responses:
        '200':
          description: Skill revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillRevisionResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/{name}/enable:
    parameters:
      - $ref: '#/components/parameters/SkillNameOnly'
      - $ref: '#/components/parameters/SkillScope'
    post:
      tags: [Skills]
      operationId: enableSkill
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Skill enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/skills/{name}/disable:
    parameters:
      - $ref: '#/components/parameters/SkillNameOnly'
      - $ref: '#/components/parameters/SkillScope'
    post:
      tags: [Skills]
      operationId: disableSkill
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Skill disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/skills/github/preview:
    post:
      tags: [Skills]
      operationId: previewGithubSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubSkillRequest'
      responses:
        '200':
          description: GitHub skill preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubSkillResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/github/import:
    post:
      tags: [Skills]
      operationId: importGithubSkill
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubSkillRequest'
      responses:
        '200':
          description: GitHub skill import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubSkillResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mcp/servers:
    get:
      tags: [MCP]
      operationId: listMcpServers
      responses:
        '200':
          description: MCP server list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
    post:
      tags: [MCP]
      operationId: registerMcpServer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerRequest'
      responses:
        '200':
          description: MCP server registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mcp/servers/{name}/enable:
    parameters:
      - $ref: '#/components/parameters/McpServerName'
    post:
      tags: [MCP]
      operationId: enableMcpServer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: MCP server enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mcp/servers/{name}/disable:
    parameters:
      - $ref: '#/components/parameters/McpServerName'
    post:
      tags: [MCP]
      operationId: disableMcpServer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: MCP server disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mcp/servers/{name}:
    parameters:
      - $ref: '#/components/parameters/McpServerName'
    delete:
      tags: [MCP]
      operationId: deleteMcpServer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: MCP server deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scheduled-tasks:
    get:
      tags: [Scheduled]
      operationId: listScheduledTasks
      responses:
        '200':
          description: Scheduled task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
    post:
      tags: [Scheduled]
      operationId: createScheduledTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledTaskRequest'
      responses:
        '200':
          description: Scheduled task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scheduled-tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/ScheduledTaskId'
    get:
      tags: [Scheduled]
      operationId: getScheduledTask
      responses:
        '200':
          description: Scheduled task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Scheduled]
      operationId: updateScheduledTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledTaskPatchRequest'
      responses:
        '200':
          description: Scheduled task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Scheduled]
      operationId: deleteScheduledTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Scheduled task deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scheduled-tasks/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/ScheduledTaskId'
    post:
      tags: [Scheduled]
      operationId: retryScheduledTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Scheduled task retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/agents/connections/setup:
    get:
      tags: [Agents]
      operationId: getAgentConnectionSetup
      parameters:
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: Agent connection setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConnectionSetupResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/library:
    get:
      tags: [Library]
      operationId: listLibrary
      responses:
        '200':
          description: Library items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/billing/plans:
    get:
      tags: [Billing]
      operationId: listBillingPlans
      responses:
        '200':
          description: Billing plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlanListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/billing/summary:
    get:
      tags: [Billing]
      operationId: getBillingSummary
      responses:
        '200':
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummaryResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/billing/checkout:
    post:
      tags: [Billing]
      operationId: createBillingCheckout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCheckoutRequest'
      responses:
        '200':
          description: Checkout projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCheckoutResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    serviceHeader:
      type: apiKey
      in: header
      name: x-kokoro-service
    internalSecret:
      type: apiKey
      in: header
      name: x-kokoro-internal-secret
    namespace:
      type: apiKey
      in: header
      name: x-kokoro-namespace
    principalId:
      type: apiKey
      in: header
      name: x-kokoro-principal-id
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    SkillName:
      name: skill
      in: path
      required: true
      schema:
        type: string
    SkillNameOnly:
      name: name
      in: path
      required: true
      schema:
        type: string
    SkillScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
    McpServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ScheduledTaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Platform:
      name: platform
      in: query
      required: true
      schema:
        type: string
        enum: [telegram, line, slack]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    RequestMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          $ref: '#/components/schemas/RequestMeta'
    HealthResponse:
      type: object
      required: [status, service, mode]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: kokoro-bff
        mode:
          type: string
          enum: [mock, live]
    Project:
      type: object
      required: [id, name, slug, description, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        instruction: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [projects]
          properties:
            projects:
              type: array
              items: { $ref: '#/components/schemas/Project' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ProjectResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [project]
          properties:
            project: { $ref: '#/components/schemas/Project' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    Task:
      type: object
      required: [id, project_id, title, status, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [todo, in_progress, done]
        updated_at: { type: string, format: date-time }
    TaskListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [tasks]
          properties:
            tasks:
              type: array
              items: { $ref: '#/components/schemas/Task' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ProjectInstructionRevision:
      type: object
      required: [id, instruction, updatedAt, actorName, current]
      properties:
        id: { type: string }
        instruction: { type: string }
        updatedAt: { type: integer, format: int64 }
        actorName: { type: string }
        current: { type: boolean }
    ProjectInstructionRevisionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectInstructionRevision' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
    UpdateProjectInstructionRequest:
      type: object
      required: [instruction]
      additionalProperties: false
      properties:
        instruction: { type: string }
    ProjectSkillRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    ProjectSkillResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [skill]
          properties:
            skill:
              type: object
              required: [project_id, name, enabled]
              properties:
                project_id: { type: string }
                name: { type: string }
                enabled: { type: boolean }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ScheduledTask:
      type: object
      required: [id, title, prompt, frequency, time, timezone, next_run_at, auto_approve, enabled, status]
      properties:
        id: { type: string }
        project_id: { type: string }
        title: { type: string }
        prompt: { type: string }
        frequency:
          type: string
          enum: [daily, weekly]
        time: { type: string }
        timezone: { type: string }
        next_run_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        auto_approve: { type: boolean }
        enabled: { type: boolean }
        status:
          type: string
          enum: [active, paused, failed]
    ScheduledTaskResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [task]
          properties:
            task: { $ref: '#/components/schemas/ScheduledTask' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ScheduledTaskListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [tasks]
          properties:
            tasks:
              type: array
              items: { $ref: '#/components/schemas/ScheduledTask' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    CreateScheduledTaskRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        prompt: { type: string }
        frequency:
          type: string
          enum: [daily, weekly]
        time: { type: string }
        timezone: { type: string }
        next_run_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        auto_approve: { type: boolean }
        enabled: { type: boolean }
        status:
          type: string
          enum: [active, paused, failed]
    ScheduledTaskPatchRequest:
      type: object
      additionalProperties: true
    Skill:
      type: object
      required: [name, description, content_hash, scope]
      properties:
        name: { type: string }
        description: { type: string }
        content_hash: { type: string }
        scope: { type: string }
        source_url: { type: string }
        enabled: { type: boolean }
        installed: { type: boolean }
        categories:
          type: array
          items: { type: string }
        updated_at: { type: integer }
    SkillListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [skills]
          properties:
            skills:
              type: array
              items: { $ref: '#/components/schemas/Skill' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    SkillPoolResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [skills]
          properties:
            skills:
              type: array
              items: { $ref: '#/components/schemas/Skill' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    SkillCatalogResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [skills, next_cursor]
          properties:
            skills:
              type: array
              items: { $ref: '#/components/schemas/Skill' }
            next_cursor:
              type: [string, 'null']
        meta: { $ref: '#/components/schemas/RequestMeta' }
    SkillQuotaResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [namespace, package_count, package_bytes, max_packages, max_bytes]
          properties:
            namespace: { type: string }
            package_count: { type: integer }
            package_bytes: { type: integer }
            max_packages: { type: integer }
            max_bytes: { type: integer }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    SkillRevision:
      type: object
      required: [scope, name, revision, content_hash, package_size, source, created_at]
      properties:
        scope: { type: string }
        name: { type: string }
        revision: { type: integer }
        content_hash: { type: string }
        package_size: { type: integer }
        source: { type: string }
        created_at: { type: integer }
    SkillRevisionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [revisions]
          properties:
            revisions:
              type: array
              items: { $ref: '#/components/schemas/SkillRevision' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    GithubSkillRequest:
      type: object
      required: [repository]
      additionalProperties: false
      properties:
        repository: { type: string }
    GithubSkillResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [repository, default_branch, skill]
          properties:
            repository: { type: string }
            default_branch: { type: string }
            skill:
              type: object
              required: [name, description]
              properties:
                name: { type: string }
                description: { type: string }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    McpServer:
      type: object
      required: [scope, name, revision, transport, url, allowed_tools, secret_ref, enabled]
      properties:
        scope: { type: string }
        name: { type: string }
        revision: { type: integer }
        transport:
          type: string
          enum: [http, streamable_http]
        url: { type: string }
        allowed_tools:
          type: array
          items: { type: string }
        secret_ref:
          type: [string, 'null']
        enabled: { type: boolean }
    McpServerRequest:
      type: object
      required: [name, transport, url, allowed_tools]
      additionalProperties: false
      properties:
        name: { type: string }
        transport:
          type: string
          enum: [http, streamable_http]
        url: { type: string }
        allowed_tools:
          type: array
          items: { type: string }
        secret_ref:
          type: [string, 'null']
    McpServerListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [servers]
          properties:
            servers:
              type: array
              items: { $ref: '#/components/schemas/McpServer' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    McpServerResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [server]
          properties:
            server: { $ref: '#/components/schemas/McpServer' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    AgentConnectionSetup:
      type: object
      required: [platform, status, qr_value, continue_url, expires_at]
      properties:
        platform:
          type: string
          enum: [telegram, line, slack]
        status:
          type: string
          enum: [disconnected, pending, connected, expired]
        qr_value: { type: string }
        continue_url: { type: string }
        expires_at: { type: string, format: date-time }
    AgentConnectionSetupResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AgentConnectionSetup' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    LibraryItem:
      type: object
      required: [id, title, type, created_at, url]
      properties:
        id: { type: string }
        title: { type: string }
        type:
          type: string
          enum: [document, spreadsheet, presentation, image, other]
        created_at: { type: string, format: date-time }
        url: { type: string }
    LibraryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/LibraryItem' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    RuntimeManifest:
      type: object
      required: [tenant_id, product_id, locale, navigation, locale_namespaces, theme, feature_flags, references, config_version, release_id, digest]
      properties:
        tenant_id: { type: string, minLength: 1 }
        product_id: { type: string, minLength: 1 }
        locale: { type: string, minLength: 2 }
        navigation:
          type: array
          items: {}
        locale_namespaces:
          type: array
          items: {}
        theme: { type: object, additionalProperties: true }
        feature_flags:
          type: array
          items: {}
        references:
          type: array
          items: {}
        config_version: { type: string, minLength: 1 }
        release_id: { type: [string, 'null'] }
        digest: { type: string, minLength: 1 }
    RuntimeManifestResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/RuntimeManifest' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    BillingPlan:
      type: object
      required: [id, key, name, currency, amount_minor, credit_micros, billing_interval]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        currency: { type: string }
        amount_minor: { type: string }
        credit_micros: { type: string }
        billing_interval:
          type: string
          enum: [once, month, year]
    BillingPlanListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [plans]
          properties:
            plans:
              type: array
              items: { $ref: '#/components/schemas/BillingPlan' }

    ModelCandidate:
      type: object
      required: [provider, name, is_default]
      properties:
        provider: { type: string }
        name: { type: string }
        is_default: { type: boolean }
        display_name: { type: string }
    ModelCandidateListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [models]
          properties:
            models:
              type: array
              items: { $ref: '#/components/schemas/ModelCandidate' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    BillingSummary:
      type: object
      required: [balance, currency, period, usage]
      properties:
        balance: { type: number }
        currency: { type: string }
        period: { type: string }
        usage: { type: number }
    BillingSummaryResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/BillingSummary' }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    BillingCheckoutRequest:
      type: object
      required: [plan_id]
      additionalProperties: false
      properties:
        plan_id: { type: string }
    BillingCheckoutResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [checkout_url]
          properties:
            checkout_url: { type: string }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    OkResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [ok]
          properties:
            ok:
              type: boolean
              const: true
        meta: { $ref: '#/components/schemas/RequestMeta' }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceAuthFailed:
      description: Service authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Request conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
