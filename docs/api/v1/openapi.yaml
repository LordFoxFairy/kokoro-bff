openapi: 3.1.0
info:
  title: Kokoro Business API
  version: 1.0.0
  description: Kokoro BFF 面向 Web 的业务契约；阶段 1 仅通过 PostgreSQL + Redis 及显式 HTTP upstream/adapter 契约协作，不新增 MySQL/Mongo 依赖。
  license:
    name: Proprietary Kokoro contract
    url: https://kokoro.invalid/license
servers:
  - url: http://127.0.0.1:4300
    description: Local mock BFF
  - url: https://bff.kokoro.invalid
    description: Production placeholder
security:
  - serviceHeader: []
    internalSecret: []
    namespace: []
    principalId: []
tags:
  - name: Health
    description: Process and dependency health probes.
  - name: System
    description: Tenant-scoped runtime manifest projection.
  - name: Projects
    description: BFF-owned projects and project resources.
  - name: Mori Music
    description: Provider-neutral music creation projections and generation events.
  - name: Chat
    description: Asynchronous sessions, messages, event streams, and run controls.
  - name: Models
    description: Tenant-visible model candidates.
  - name: Skills
    description: Skill catalog, revisions, quotas, and lifecycle operations.
  - name: MCP
    description: MCP server projections and lifecycle operations.
  - name: Scheduled
    description: BFF-owned scheduled task definitions.
  - name: Agents
    description: Agent connection setup projections.
  - name: Library
    description: Storage-owned library projection.
  - name: Billing
    description: Billing catalog, summary, and checkout projections.
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Check process health
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid probe request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: Check service readiness
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Required upstreams are not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid probe request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/system/runtime-manifest:
    get:
      tags: [System]
      operationId: getRuntimeManifest
      summary: Get the tenant runtime manifest
      description: Resolves the configured host through IAM, loads the System owner manifest, and projects its resource fields once into the BFF v1 snake_case transport.
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: locale
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: surface_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: IAM-derived tenant runtime manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeManifestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '502':
          description: IAM or System owner transport/contract failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: IAM/System owner is not configured or unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/sessions:
    get:
      tags: [Chat]
      operationId: listSessions
      summary: List chat sessions
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List visible models
      parameters:
        - name: feature_key
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tenant-visible model candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCandidateListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: getSessionSnapshot
      summary: Get a session snapshot
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshotResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chat]
      operationId: deleteSession
      summary: Delete a chat session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Delete receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: listSessionMessages
      summary: List session messages
      description: Cursor-paginated message history for a session. This is the v1 equivalent of Manus task.listMessages; session detail remains a bounded metadata snapshot.
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Cursor-paginated session messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMessageListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Chat]
      operationId: createMessage
      summary: Submit a session message
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
            example:
              content: Review the latest project changes.
              model: default
              project_ref: project_kokoro
      responses:
        '202':
          description: Message receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: streamSessionEvents
      summary: Stream session events
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Session event stream
          headers:
            X-Kokoro-Request-Id:
              description: Request correlation identifier for the stream setup.
              schema:
                $ref: '#/components/schemas/RequestId'
              example: req_01JASYNC000000000000000000
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SessionEventStream'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/runs/{runId}/control:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Chat]
      operationId: controlRun
      summary: Control an asynchronous run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunControlRequest'
            examples:
              cancel:
                value:
                  kind: run.cancel
              resume:
                value:
                  kind: run.resume
                  decisions:
                    - type: approve
                      tool_id: tool_01J
      responses:
        '202':
          description: Run control receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/title:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      tags: [Chat]
      operationId: renameSession
      summary: Rename a chat session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
      responses:
        '200':
          description: Rename receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/share:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chat]
      operationId: createShare
      summary: Create a session share
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Share receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareReceiptResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Chat]
      operationId: revokeShare
      summary: Revoke a session share
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Share receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareReceiptResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/shared/{shareId}:
    parameters:
      - $ref: '#/components/parameters/ShareId'
    get:
      tags: [Chat]
      operationId: getSharedSessionSnapshot
      summary: Get a shared session snapshot
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Shared session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshotResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: Project projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProjectInstruction
      summary: Update project instructions
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInstructionRequest'
      responses:
        '200':
          description: Updated project projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mori/projects:
    get:
      tags: [Mori Music]
      operationId: listMoriProjects
      summary: List Mori music projects
      responses:
        '200':
          description: Mori project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriProjectListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
    post:
      tags: [Mori Music]
      operationId: createMoriProject
      summary: Create a Mori music project
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoriProjectRequest'
      responses:
        '201':
          description: Mori project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriProjectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mori/projects/{projectRef}:
    parameters:
      - $ref: '#/components/parameters/MoriProjectRef'
    get:
      tags: [Mori Music]
      operationId: getMoriProject
      summary: Get a Mori music project
      responses:
        '200':
          description: Mori project projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriProjectResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/mori/projects/{projectRef}/song_plans:
    parameters:
      - $ref: '#/components/parameters/MoriProjectRef'
    post:
      tags: [Mori Music]
      operationId: createMoriSongPlan
      summary: Create a project-bound Mori Song Plan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoriSongPlanRequest'
      responses:
        '201':
          description: Song Plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriSongPlanResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mori/projects/{projectRef}/generations:
    parameters:
      - $ref: '#/components/parameters/MoriProjectRef'
    post:
      tags: [Mori Music]
      operationId: createMoriGeneration
      summary: Queue a Mori music generation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoriGenerationRequest'
      responses:
        '202':
          description: Generation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriGenerationReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mori/generations/{generationRef}:
    parameters:
      - $ref: '#/components/parameters/MoriGenerationRef'
    get:
      tags: [Mori Music]
      operationId: getMoriGeneration
      summary: Get a Mori generation snapshot
      responses:
        '200':
          description: Generation snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriGenerationResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/mori/generations/{generationRef}/events:
    parameters:
      - $ref: '#/components/parameters/MoriGenerationRef'
      - $ref: '#/components/parameters/MoriLastEventId'
    get:
      tags: [Mori Music]
      operationId: streamMoriGenerationEvents
      summary: Stream Mori generation progress events
      responses:
        '200':
          description: Server-sent generation events
          content:
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/mori/generations/{generationRef}/cancel:
    parameters:
      - $ref: '#/components/parameters/MoriGenerationRef'
    post:
      tags: [Mori Music]
      operationId: cancelMoriGeneration
      summary: Cancel a Mori generation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriGenerationReceiptResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mori/projects/{projectRef}/candidates:
    parameters:
      - $ref: '#/components/parameters/MoriProjectRef'
    get:
      tags: [Mori Music]
      operationId: listMoriCandidates
      summary: List generated Mori candidates for a project
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Candidate directions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriCandidateListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/mori/candidates/{candidateRef}/promote:
    parameters:
      - $ref: '#/components/parameters/MoriCandidateRef'
    post:
      tags: [Mori Music]
      operationId: promoteMoriCandidate
      summary: Promote a Mori candidate into the current project version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Version created or confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriPromoteResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mori/versions/{versionRef}/remix:
    parameters:
      - $ref: '#/components/parameters/MoriVersionRef'
    post:
      tags: [Mori Music]
      operationId: remixMoriVersion
      summary: Queue a new generation from a Mori version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoriGenerationRequest'
      responses:
        '202':
          description: Remix generation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriGenerationReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mori/library:
    get:
      tags: [Mori Music]
      operationId: listMoriLibrary
      summary: List promoted Mori versions across projects
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [all, version], default: all }
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Mori library projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriLibraryListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/mori/versions/{versionRef}/exports:
    parameters:
      - $ref: '#/components/parameters/MoriVersionRef'
    post:
      tags: [Mori Music]
      operationId: createMoriExport
      summary: Queue an export for a Mori version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoriExportRequest'
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoriExportReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
