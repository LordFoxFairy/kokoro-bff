openapi: 3.1.0
info:
  title: Kokoro Business API
  version: 1.0.0
  description: Kokoro BFF 面向 Web 的业务契约；阶段 1 仅通过 PostgreSQL + Redis 及显式 HTTP upstream/adapter 契约协作，不新增 MySQL/Mongo 依赖。
  license:
    name: Proprietary Kokoro contract
    url: https://kokoro.invalid/license
servers:
  - url: http://127.0.0.1:4300
    description: Local mock BFF
  - url: https://bff.kokoro.invalid
    description: Production placeholder
security:
  - serviceHeader: []
    internalSecret: []
    namespace: []
    principalId: []
tags:
  - name: Health
    description: Process and dependency health probes.
  - name: System
    description: Tenant-scoped runtime manifest projection.
  - name: Projects
    description: BFF-owned projects and project resources.
  - name: Chat
    description: Asynchronous sessions, messages, event streams, and run controls.
  - name: Models
    description: Tenant-visible model candidates.
  - name: Skills
    description: Skill catalog, revisions, quotas, and lifecycle operations.
  - name: MCP
    description: MCP server projections and lifecycle operations.
  - name: Scheduled
    description: BFF-owned scheduled task definitions.
  - name: Agents
    description: Agent connection setup projections.
  - name: Library
    description: Storage-owned library projection.
  - name: Billing
    description: Billing catalog, summary, and checkout projections.
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Check process health
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid probe request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: Check service readiness
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Required upstreams are not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid probe request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/system/runtime-manifest:
    get:
      tags: [System]
      operationId: getRuntimeManifest
      summary: Get the tenant runtime manifest
      description: Resolves the configured host through IAM, loads the System owner manifest, and projects its resource fields once into the BFF v1 snake_case transport.
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: locale
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: surface_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: IAM-derived tenant runtime manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeManifestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '502':
          description: IAM or System owner transport/contract failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: IAM/System owner is not configured or unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/sessions:
    get:
      tags: [Chat]
      operationId: listSessions
      summary: List chat sessions
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List visible models
      parameters:
        - name: feature_key
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Tenant-visible model candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCandidateListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: getSessionSnapshot
      summary: Get a session snapshot
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshotResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chat]
      operationId: deleteSession
      summary: Delete a chat session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Delete receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSessionResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chat]
      operationId: createMessage
      summary: Submit a session message
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
            example:
              content: Review the latest project changes.
              model: default
              project_ref: project_kokoro
      responses:
        '202':
          description: Message receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: streamSessionEvents
      summary: Stream session events
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Session event stream
          headers:
            X-Kokoro-Request-Id:
              description: Request correlation identifier for the stream setup.
              schema:
                $ref: '#/components/schemas/RequestId'
              example: req_01JASYNC000000000000000000
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SessionEventStream'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/runs/{runId}/control:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Chat]
      operationId: controlRun
      summary: Control an asynchronous run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunControlRequest'
            examples:
              cancel:
                value:
                  kind: run.cancel
              resume:
                value:
                  kind: run.resume
                  decisions:
                    - type: approve
                      tool_id: tool_01J
      responses:
        '202':
          description: Run control receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlReceiptResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/title:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      tags: [Chat]
      operationId: renameSession
      summary: Rename a chat session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
      responses:
        '200':
          description: Rename receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/sessions/{id}/share:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chat]
      operationId: createShare
      summary: Create a session share
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Share receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareReceiptResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Chat]
      operationId: revokeShare
      summary: Revoke a session share
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Share receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareReceiptResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/shared/{shareId}:
    parameters:
      - $ref: '#/components/parameters/ShareId'
    get:
      tags: [Chat]
      operationId: getSharedSessionSnapshot
      summary: Get a shared session snapshot
      parameters:
        - $ref: '#/components/parameters/ScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
      responses:
        '200':
          description: Shared session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshotResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: Project projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProjectInstruction
      summary: Update project instructions
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInstructionRequest'
      responses:
        '200':
          description: Updated project projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectTasks
      summary: List project tasks
      responses:
        '200':
          description: Project task projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects/{projectId}/instruction-revisions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectInstructionRevisions
      summary: List instruction revisions
      responses:
        '200':
          description: Instruction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInstructionRevisionResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects/{projectId}/resources:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: uploadProjectResources
      summary: Upload project resources
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Resource request accepted by the BFF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}/skills/{skill}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SkillName'
    patch:
      tags: [Projects]
      operationId: updateProjectSkill
      summary: Update project skill state
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSkillRequest'
      responses:
        '200':
          description: Project skill state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSkillResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/projects/{projectId}/scheduled-tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: createProjectScheduledTask
      summary: Create a project scheduled task
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledTaskRequest'
      responses:
        '200':
          description: Project scheduled task projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List skills
      responses:
        '200':
          description: Skill projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/pool:
    get:
      tags: [Skills]
      operationId: listSkillPool
      summary: List the skill pool
      responses:
        '200':
          description: Skill pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPoolResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/catalog:
    get:
      tags: [Skills]
      operationId: listSkillCatalog
      summary: List the skill catalog
      responses:
        '200':
          description: Skill catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillCatalogResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/quota:
    get:
      tags: [Skills]
      operationId: getSkillQuota
      summary: Get skill quota
      responses:
        '200':
          description: Skill quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillQuotaResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/{name}/revisions:
    parameters:
      - $ref: '#/components/parameters/SkillNameOnly'
      - $ref: '#/components/parameters/SkillScope'
    get:
      tags: [Skills]
      operationId: listSkillRevisions
      summary: List skill revisions
      responses:
        '200':
          description: Skill revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillRevisionResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/{name}/enable:
    parameters:
      - $ref: '#/components/parameters/SkillNameOnly'
      - $ref: '#/components/parameters/SkillScope'
    post:
      tags: [Skills]
      operationId: enableSkill
      summary: Enable a skill
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Skill enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/skills/{name}/disable:
    parameters:
      - $ref: '#/components/parameters/SkillNameOnly'
      - $ref: '#/components/parameters/SkillScope'
    post:
      tags: [Skills]
      operationId: disableSkill
      summary: Disable a skill
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Skill disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/skills/github/preview:
    post:
      tags: [Skills]
      operationId: previewGithubSkill
      summary: Preview a GitHub skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubSkillRequest'
      responses:
        '200':
          description: GitHub skill preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubSkillResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
  /v1/skills/github/import:
    post:
      tags: [Skills]
      operationId: importGithubSkill
      summary: Import a GitHub skill
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubSkillRequest'
      responses:
        '200':
          description: GitHub skill import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubSkillResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mcp/servers:
    get:
      tags: [MCP]
      operationId: listMcpServers
      summary: List MCP servers
      responses:
        '200':
          description: MCP server list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerListResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
    post:
      tags: [MCP]
      operationId: registerMcpServer
      summary: Register an MCP server
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerRequest'
      responses:
        '200':
          description: MCP server registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpServerResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mcp/servers/{name}/enable:
    parameters:
      - $ref: '#/components/parameters/McpServerName'
    post:
      tags: [MCP]
      operationId: enableMcpServer
      summary: Enable an MCP server
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: MCP server enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/mcp/servers/{name}/disable:
