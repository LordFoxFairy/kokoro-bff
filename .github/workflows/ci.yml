name: BFF CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: kokoro_worker_bff
          POSTGRES_USER: kokoro
          POSTGRES_PASSWORD: kokoro_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U kokoro -d kokoro_worker_bff"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=30
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 56379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=15
    env:
      KOKORO_BFF_POSTGRES_URL: postgresql://kokoro:kokoro_ci@127.0.0.1:55432/kokoro_worker_bff
      KOKORO_TEST_POSTGRES_URL: postgresql://kokoro:kokoro_ci@127.0.0.1:55432/kokoro_worker_bff
      KOKORO_BFF_REDIS_URL: redis://127.0.0.1:56379/8
      KOKORO_TEST_REDIS_URL: redis://127.0.0.1:56379/8
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Scan dependencies, source configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Install canonical PostgreSQL schema
        run: pnpm db:apply-schema
      - name: Run schema governance tests
        run: pnpm schema:check
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Check public contract
        run: pnpm contract:check
      - name: Run unit and architecture tests
        run: pnpm test
      - name: Run real PostgreSQL and Redis integration tests
        run: pnpm test:integration
      - name: Build production image
        run: docker build --tag kokoro-bff:ci .
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kokoro-bff:ci
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
