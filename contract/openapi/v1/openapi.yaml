  /v1/projects/{projectId}/name:
    parameters:
      - $ref: '#/components/parameters/RenameProjectId'
    patch:
      tags: [Projects]
      operationId: renameProject
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: required
      x-kokoro-permission: project.update
      summary: Set the display name of an owned active Project
      description: >-
        Accepts exactly one application/json Content-Type and at most 65536 raw body bytes;
        no query (including a bare question mark), slug alias, duplicate JSON keys,
        malformed UTF-8, lone surrogate, extra fields or U+0000 are accepted.
        Missing Idempotency-Key is idempotency_key_required; a malformed or repeated key,
        invalid canonical ID, body or oversized body is invalid_project_rename (400).
        Every request, including replay, requires current IAM admission and locked active
        tenant/owner qualification before reading the receipt; invisible Projects return 404.
        Only name and, when changed, updated_at are written; ID, slug, instruction and all
        associations remain unchanged. Setting the current normalized name is a no-op for
        Project facts, but a new key still records its final receipt in the same transaction.
        Different keys use last legal serialized commit wins, without version, ETag or If-Match.
        An old key returns only its original ACK and never rewrites a newer name; GET/list
        after ACK is authoritative and may already reflect a subsequent legal commit.
        The same scoped key with a different normalized name returns 409 idempotency_conflict.
        Name and the existing durable receipt commit atomically. An unknown COMMIT returns
        503; a later same-key request repeats admission and current authorization before
        reconciling the original receipt. Request IDs exist only in response headers.
      parameters:
        - $ref: '#/components/parameters/RenameProjectIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameProjectRequest' }
      responses:
        '200': { $ref: '#/components/responses/RenameProjectSuccess' }
        '400': { $ref: '#/components/responses/RenameProjectBadRequest' }
        '401': { $ref: '#/components/responses/RenameProjectUnauthorized' }
        '403': { $ref: '#/components/responses/RenameProjectForbidden' }
        '404': { $ref: '#/components/responses/RenameProjectNotFound' }
        '409': { $ref: '#/components/responses/RenameProjectConflict' }
        '429': { $ref: '#/components/responses/RenameProjectRateLimited' }
        '503': { $ref: '#/components/responses/RenameProjectUnavailable' }
