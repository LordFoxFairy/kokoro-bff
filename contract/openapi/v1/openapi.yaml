      content: { application/json: { schema: { $ref: '#/components/schemas/McpProviderAdminRemovalResponse' } } }
    McpProviderAdminError:
      description: Closed admitted-provider administration failure
      headers: { x-request-id: { required: true, schema: { type: string } }, Cache-Control: { required: true, schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/McpProviderAdminErrorResponse' } } }
    ConnectorListInvalidArgument:
      description: The connector.list request has query parameters, a body, or a disallowed request header.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok, request_id, error]
            properties:
              ok: { type: boolean, const: false }
              request_id: { type: string, minLength: 1, maxLength: 128 }
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string, const: InvalidArgument }
                  message: { type: string, const: Connector list request is invalid }
    ConnectorListUnauthenticated:
      description: A current caller session is required.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok, request_id, error]
            properties:
              ok: { type: boolean, const: false }
              request_id: { type: string, minLength: 1, maxLength: 128 }
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string, const: Unauthenticated }
                  message: { type: string, const: Connector list access is unavailable }
    ConnectorListPermissionDenied:
      description: The current caller cannot read personal connectors.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok, request_id, error]
            properties:
              ok: { type: boolean, const: false }
              request_id: { type: string, minLength: 1, maxLength: 128 }
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string, const: PermissionDenied }
                  message: { type: string, const: Connector list access is unavailable }
    ConnectorListInvalidOwnerResponse:
      description: Platform returned connector/provider data that cannot be safely projected to the public contract.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok, request_id, error]
            properties:
              ok: { type: boolean, const: false }
              request_id: { type: string, minLength: 1, maxLength: 128 }
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string, const: connector_response_invalid }
                  message: { type: string, const: Connector list dependency returned an invalid response }
    ConnectorListUnavailable:
      description: IAM or Platform connector data is temporarily unavailable.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok, request_id, error]
            properties:
              ok: { type: boolean, const: false }
              request_id: { type: string, minLength: 1, maxLength: 128 }
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string, const: Unavailable }
                  message: { type: string, const: Connector list dependency is unavailable }
    SkillPackageInspectionOk:
      description: Exact caller-authorized package directory or selected UTF-8 text.
      headers: &SkillPackageInspectionHeaders
        x-request-id: { required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        Cache-Control: { required: true, schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SkillPackageInspectionResponse' }
    SkillPackageInspectionBadRequest:
      description: Package inspection input is invalid.
      headers: *SkillPackageInspectionHeaders
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SkillPackageInspectionErrorResponse'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [invalid_skill_package_request] }
                      retryable: { type: boolean, const: false }
    SkillPackageInspectionUnauthorized:
      description: Current Product session authentication failed.
      headers: *SkillPackageInspectionHeaders
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SkillPackageInspectionErrorResponse'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [session_authentication_required, session_invalid] }
                      retryable: { type: boolean, const: false }
    SkillPackageInspectionForbidden:
      description: Trusted service or admitted Product tenant is forbidden.
      headers: *SkillPackageInspectionHeaders
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SkillPackageInspectionErrorResponse'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [service_auth_failed, session_forbidden, product_tenant_forbidden] }
                      retryable: { type: boolean, const: false }
    SkillPackageInspectionNotFound:
      description: Package is absent, removed or hidden by ownership policy; file absence uses the same non-disclosing result.
      headers: *SkillPackageInspectionHeaders
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SkillPackageInspectionErrorResponse'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [skill_package_not_found] }
                      retryable: { type: boolean, const: false }
    SkillPackageInspectionPreconditionFailed:
      description: Exact authorized package is not currently previewable.
      headers: *SkillPackageInspectionHeaders
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SkillPackageInspectionErrorResponse'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [skill_package_precondition_failed] }
                      retryable: { type: boolean, const: false }
    SkillPackageInspectionRateLimited:
      description: Session admission may return retryable session_rate_limited with optional Retry-After; skill_package_limit_exceeded is not retryable and omits Retry-After.
      headers:
        <<: *SkillPackageInspectionHeaders
        Retry-After: { required: false, schema: { type: string, pattern: '^(?:[1-9][0-9]{0,3}|[1-7][0-9]{4}|8[0-5][0-9]{3}|86[0-3][0-9]{2}|86400)(?![\s\S])' } }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SkillPackageInspectionErrorResponse'
              - oneOf:
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: { type: string, const: session_rate_limited }
                          retryable: { type: boolean, const: true }
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: { type: string, const: skill_package_limit_exceeded }
                          retryable: { type: boolean, const: false }
    SkillPackageInspectionBadGateway:
      description: Owner response or package projection is invalid.
      headers: *SkillPackageInspectionHeaders
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SkillPackageInspectionErrorResponse'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [skill_package_response_invalid] }
                      retryable: { type: boolean, const: false }
    SkillPackageInspectionUnavailable:
      description: IAM or Platform package inspection dependency is unavailable.
      headers: *SkillPackageInspectionHeaders
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SkillPackageInspectionErrorResponse'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [product_tenant_not_configured, iam_admission_unavailable, skill_package_dependency_unavailable] }
                      retryable: { type: boolean, const: true }
