              example: null
        meta: { $ref: '#/components/schemas/RequestMeta' }
      example:
        data:
          messages: []
          next_cursor: null
        meta:
          request_id: req_01JASYNC000000000000000000
    ChatSession:
      type: object
      required: [session_id, title, owner_id, created_at, updated_at]
      additionalProperties: false
      properties:
        session_id: { type: string, minLength: 1 }
        title: { type: string }
        owner_id: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      example:
        session_id: session_kokoro
        title: Review business API contract
        owner_id: ns_test
        created_at: '2026-01-01T00:00:00.000Z'
        updated_at: '2026-01-01T00:00:00.000Z'
    ChatMessage:
      type: object
      required: [message_id, role, content, status, created_at]
      additionalProperties: false
      properties:
        selected_skill_source_refs:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string, pattern: '^skill:(?!skill:)[A-Za-z0-9][A-Za-z0-9._:-]{0,190}(?![\s\S])' }
        message_id: { type: string, minLength: 1 }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        status:
          type: string
          enum: [pending, streaming, completed, failed]
        created_at: { type: string, format: date-time }
        run_id: { type: string }
        failure:
          type: object
          required: [source, code, retryable]
          additionalProperties: false
          properties:
            source: { type: string, const: agent }
            code:
              type: string
              enum:
                - token_budget_exceeded
                - recursion_limit_exceeded
                - assembly_failed
                - enqueue_failed
                - dispatch_exhausted
                - contract_incompatible
                - internal_error
                - model_unavailable
                - dependency_unavailable
                - model_access_denied
            retryable: { type: boolean }
          if:
            properties:
              retryable: { const: true }
          then:
            properties:
              code: { enum: [model_unavailable, dependency_unavailable] }
      allOf:
        - if:
            required: [failure]
          then:
            required: [run_id]
            properties:
              role: { const: assistant }
              status: { const: failed }
              run_id: { type: string, minLength: 1 }
      example:
        message_id: msg_01JUSER
        role: user
        content: Review the contract
        status: completed
        created_at: '2026-01-01T00:00:00.000Z'
        run_id: run_01JASYNC
    InteractionValidation:
      type: object
      required:
      - code
      - instance_path
      properties:
        code:
          type: string
          const: json_schema_invalid
        instance_path:
          type: array
          items:
            type:
            - string
            - integer
            minimum: -9007199254740991
            maximum: 9007199254740991
      additionalProperties: false
    InteractionDisplay:
      type: object
      required:
      - name
      - description
      - editable
      - input_schema
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        editable:
          type: boolean
        input_schema:
          type: object
          additionalProperties: true
        result_preview:
          type:
          - string
          - 'null'
        truncated:
          type:
          - boolean
          - 'null'
        source:
          type:
          - string
          - 'null'
      additionalProperties: false
      allOf:
      - if:
          required:
          - result_preview
          properties:
            result_preview:
              type: string
          additionalProperties: true
        then:
          required:
          - truncated
          - source
          properties:
            truncated:
              type: boolean
            source:
              type: string
              minLength: 1
          additionalProperties: true
    InteractionItem:
      type: object
      required:
      - item_id
      - request_id
      - kind
      - allowed_decisions
      - display
      properties:
        item_id:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - tool_approval
          - ask_user_question
          - result_review
          - input
        allowed_decisions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - approve
            - edit
            - reject
            - respond
            - submit
        display:
          $ref: '#/components/schemas/InteractionDisplay'
        validation:
          anyOf:
          - $ref: '#/components/schemas/InteractionValidation'
          - type: 'null'
      additionalProperties: false
    InteractionGroup:
      type: object
      required:
      - group_id
      - items
      properties:
        group_id:
          type: string
          minLength: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InteractionItem'
      additionalProperties: false
    InteractionActionResult:
      type: object
      required:
      - command_id
      - pause_revision
      - kind
      properties:
        command_id:
          type: string
          minLength: 1
        pause_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        kind:
          type: string
          enum:
          - accepted
          - native_consumed
          - validation_failed
          - unknown
          - cancelled
      additionalProperties: false
    ChatInteractionState:
      type: object
      required:
      - interaction_revision
      - pause_revision
      - pause_ref
      - phase
      - groups
      - action_result
      properties:
        interaction_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        pause_revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        pause_ref:
          type:
          - string
          - 'null'
          minLength: 1
        phase:
          type: string
          enum:
          - active
          - waiting
          - resuming
          - terminal
        groups:
          type: array
          items:
            $ref: '#/components/schemas/InteractionGroup'
        action_result:
          anyOf:
          - $ref: '#/components/schemas/InteractionActionResult'
          - type: 'null'
      additionalProperties: false
      allOf:
      - if:
          properties:
            phase:
              enum:
              - waiting
              - resuming
          additionalProperties: true
        then:
          properties:
            groups:
              minItems: 1
            pause_revision:
              minimum: 1
          additionalProperties: true
        else:
          properties:
            groups:
              maxItems: 0
          additionalProperties: true
      - if:
          properties:
            pause_revision:
              const: 0
          additionalProperties: true
        then:
          properties:
            pause_ref:
              type: 'null'
          additionalProperties: true
        else:
          properties:
            pause_ref:
              type: string
              minLength: 1
          additionalProperties: true
      - if:
          properties:
            phase:
              const: resuming
          additionalProperties: true
        then:
          properties:
            action_result:
              allOf:
              - $ref: '#/components/schemas/InteractionActionResult'
              - properties:
                  kind:
                    enum:
                    - accepted
                    - unknown
                additionalProperties: true
          additionalProperties: true
      description: Complete replacement of the pending collection, never a delta. Runtime additionally enforces globally unique group/item IDs, pause_revision
        <= interaction_revision, action_result.pause_revision <= pause_revision, exact current revision for resuming, and an earlier action revision for validation_failed
        waiting. Locator, arguments and submitted values are private and absent.
    ResumeDecision:
      oneOf:
      - type: object
        required:
        - type
        - item_id
        properties:
          type:
            const: approve
          args:
            type:
            - object
            - 'null'
            additionalProperties: true
          item_id:
            type: string
            minLength: 1
        additionalProperties: false
      - type: object
        required:
        - type
        - item_id
        - args
        properties:
          type:
            const: edit
          args:
            type: object
            additionalProperties: true
          item_id:
            type: string
            minLength: 1
        additionalProperties: false
      - type: object
        required:
        - type
        - item_id
        properties:
          type:
            const: reject
          reason:
            type:
            - string
            - 'null'
          item_id:
            type: string
            minLength: 1
        additionalProperties: false
      - type: object
        required:
        - type
        - item_id
        - response
        properties:
          type:
            const: respond
          response:
            type: string
            minLength: 1
          item_id:
            type: string
            minLength: 1
        additionalProperties: false
      - type: object
        required:
        - type
        - item_id
        - value
        properties:
          type:
            const: submit
          value:
            type: object
            additionalProperties: true
          item_id:
            type: string
            minLength: 1
        additionalProperties: false
    PendingPause:
      allOf:
      - $ref: '#/components/schemas/ChatInteractionState'
      - type: object
        properties:
          phase:
            enum:
            - waiting
            - resuming
          pause_revision:
            type: integer
            minimum: 1
            maximum: 9007199254740991
          pause_ref:
            type: string
            minLength: 1
        additionalProperties: true
    ExecutionHead:
      type: object
      required:
      - run_id
      - state
      - pending_pauses
      additionalProperties: false
      properties:
        run_id:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - queued
          - active
          - waiting
          - resuming
        pending_pauses:
          type: array
          items:
            $ref: '#/components/schemas/PendingPause'
          maxItems: 1
      allOf:
      - if:
          properties:
            state:
              enum:
              - waiting
              - resuming
          additionalProperties: true
        then:
          properties:
            pending_pauses:
              minItems: 1
          additionalProperties: true
        else:
          properties:
            pending_pauses:
              maxItems: 0
          additionalProperties: true
      - if:
          properties:
            state:
              const: waiting
          additionalProperties: true
        then:
          properties:
            pending_pauses:
              items:
                properties:
                  phase:
                    const: waiting
                additionalProperties: true
          additionalProperties: true
      - if:
          properties:
            state:
              const: resuming
          additionalProperties: true
        then:
          properties:
            pending_pauses:
              items:
                properties:
                  phase:
                    const: resuming
                additionalProperties: true
          additionalProperties: true
    RunExecutionProcess:
      type: object
      required: [run_id, todos, activities, next_cursor]
      additionalProperties: false
      properties:
        run_id: { type: string, minLength: 1 }
        todos:
          oneOf:
            - type: array
              maxItems: 100
              items:
                type: object
                required: [content, status]
                additionalProperties: false
                properties:
                  content: { type: string, minLength: 1, maxLength: 1024 }
                  status: { type: string, enum: [pending, in_progress, completed] }
            - type: 'null'
        activities:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RunProcessActivity' }
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/EventCursor'
            - type: 'null'
    RunProcessPage:
      type: object
      required: [run_id, todos, activities, next_cursor, event_watermark]
      additionalProperties: false
      properties:
        run_id: { type: string, minLength: 1 }
        todos:
          oneOf:
            - type: array
              maxItems: 100
              items:
                type: object
                required: [content, status]
                additionalProperties: false
                properties:
                  content: { type: string, minLength: 1, maxLength: 1024 }
                  status: { type: string, enum: [pending, in_progress, completed] }
            - type: 'null'
        activities:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RunProcessActivity' }
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/EventCursor'
            - type: 'null'
        event_watermark: { $ref: '#/components/schemas/EventCursor' }
    RunProcessPageResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
