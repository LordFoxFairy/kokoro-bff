          required: [items, next_cursor]
          properties:
            items:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                required: [asset_id, filename, mime_type, size_bytes, content_sha256, scan_state, created_at]
                properties:
                  asset_id: { type: string, minLength: 1, maxLength: 191 }
                  filename: { type: string, minLength: 1, maxLength: 255 }
                  mime_type: { type: string, minLength: 1, maxLength: 191 }
                  size_bytes: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
                  content_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  scan_state: { type: string, enum: [clean] }
                  created_at: { type: string, format: date-time }
            next_cursor: { type: [string, 'null'], minLength: 1, maxLength: 4096 }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    ProjectResourceUploadResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [resources]
          properties:
            resources:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                required: [upload_id, asset_id, filename, mime_type, size_bytes, content_sha256, scan_state]
                properties:
                  upload_id: { type: string, minLength: 1 }
                  asset_id: { type: string, minLength: 1 }
                  filename: { type: string, minLength: 1, maxLength: 255 }
                  mime_type: { type: string, minLength: 1, maxLength: 191 }
                  size_bytes: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
                  content_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  scan_state: { type: string, enum: [clean] }
        meta:
          $ref: '#/components/schemas/RequestMeta'

    RequestId:
      type: string
      minLength: 1
      maxLength: 256
      description: Request correlation identifier echoed by every v1 envelope.
      example: req_01JASYNC000000000000000000
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination cursor. Clients must not parse or construct it.
      example: cur_01JNEXT000000000000000000
    EventCursor:
      type: string
      minLength: 37
      maxLength: 37
      pattern: '^agui_[0-9a-f]{32}$'
      description: Opaque cursor for one durable BFF AG-UI frame. Clients must not parse or construct it.
      example: agui_0123456789abcdef0123456789abcdef
    EventWatermark:
      description: Cursor of the current durable AG-UI ledger head, or null before the first public frame.
      oneOf:
        - $ref: '#/components/schemas/EventCursor'
        - type: 'null'
    RequestMeta:
      type: object
      required: [request_id]
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
      example:
        request_id: req_01JASYNC000000000000000000
    TeamPageMeta:
      type: object
      required: [request_id, next_cursor]
