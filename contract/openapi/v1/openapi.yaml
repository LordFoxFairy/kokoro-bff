        meta:
          request_id: req_01JASYNC000000000000000000
    SessionEventStream:
      type: string
      description: AG-UI server-sent event frames read from the BFF PostgreSQL ledger. Each id is a distinct opaque resume cursor. CUSTOM kokoro.interaction.state carries one complete ChatInteractionState in value; HTTP control admission does not resolve it.
      x-kokoro-custom-event-values:
        kokoro.interaction.state:
          $ref: '#/components/schemas/ChatInteractionState'
      example: |-
        id: agui_0123456789abcdef0123456789abcdef
        data: {"type":"CUSTOM","name":"kokoro.interaction.state","timestamp":1767225604000,"value":{"interaction_revision":1,"pause_revision":1,"pause_ref":"pause_01J","phase":"waiting","groups":[{"group_id":"group_01J","items":[{"item_id":"item_01J","request_id":"request_01J","kind":"tool_approval","allowed_decisions":["approve","reject"],"display":{"name":"Review","description":"Approve this action","editable":false,"input_schema":{"type":"object"}}}]}],"action_result":null},"metadata":{"kokoro":{"event_id":"agent_event_4","seq":4,"session_id":"session_kokoro","run_id":"run_01JASYNC","timestamp":"2026-01-01T00:00:04.000Z"}}}

        id: agui_abcdef0123456789abcdef0123456789ab
        data: {"type":"RUN_FINISHED","timestamp":1767225605000,"threadId":"session_kokoro","runId":"run_01JASYNC","metadata":{"kokoro":{"event_id":"agent_event_5","seq":5,"session_id":"session_kokoro","run_id":"run_01JASYNC","timestamp":"2026-01-01T00:00:05.000Z"}}}
    RenameProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: >-
            Apply ECMAScript trim, then require 1..160 UTF-16 code units. U+0000 is invalid.
            Internal whitespace, case and Unicode normalization remain unchanged; duplicate
            display names are allowed. The limit applies after trimming, not to raw Unicode
            code points; 80 astral characters fit, 81 do not. Existing creation rules are unchanged.
          pattern: '^[^\u0000]*$'
      example: { name: '  我的项目  ' }
