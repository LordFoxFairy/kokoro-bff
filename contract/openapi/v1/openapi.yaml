      type: object
      additionalProperties: false
      required: [source_ref, revision, files, selected_file]
      description: >-
        Directory reads require selected_file null. File reads require a selected path that is unique in the deterministically sorted
        files list, with size_bytes equal to the original UTF-8 bytes; empty text is an empty string, and an original BOM and line
        endings are preserved.
      properties:
        source_ref: { type: string, minLength: 7, maxLength: 197, pattern: '^skill:[A-Za-z0-9][A-Za-z0-9._:-]{0,190}(?![\s\S])' }
        revision:
          type: string
          pattern: '^(?:[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-4]|18446744073709551615)(?![\s\S])'
        files:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/SkillPackageInspectionFile' }
        selected_file:
          oneOf:
            - { type: 'null' }
