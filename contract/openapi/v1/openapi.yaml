  responses:
    McpProviderAdminListOk:
      description: Current platform administrator provider directory
      headers: { x-request-id: { required: true, schema: { type: string } }, Cache-Control: { required: true, schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/McpProviderAdminListResponse' } } }
    McpProviderAdminDetailOk:
      description: Current platform administrator provider record
      headers: { x-request-id: { required: true, schema: { type: string } }, Cache-Control: { required: true, schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/McpProviderAdminDetailResponse' } } }
    McpProviderAdminDetailCreated:
      description: Created platform administrator provider record
      headers: { x-request-id: { required: true, schema: { type: string } }, Cache-Control: { required: true, schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/McpProviderAdminDetailResponse' } } }
    McpProviderAdminRemovalOk:
