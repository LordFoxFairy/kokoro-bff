components:
  securitySchemes:
    serviceHeader:
      type: apiKey
      in: header
      name: x-kokoro-service
    internalSecret:
      type: apiKey
      in: header
      name: x-kokoro-internal-secret
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    McpProviderAdminKey:
      name: provider_key
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }
    McpProviderAdminIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 191 }
    AdminIdentityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AdminIdentityCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    AdminModelRoutingLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AdminModelRoutingCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    AdminModelRoutingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one printable value; never trimmed or comma-joined.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x2B\x2D-\x7E]+$
    MoveSessionId:
      name: id
      in: path
      required: true
      description: Canonical Conversation ID; aliases and slugs are not accepted by Move.
      schema:
        type: string
        pattern: '^conv_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    SessionId:
      name: id
      in: path
      required: true
      description: Opaque chat session identifier.
      schema:
        type: string
        minLength: 1
      example: session_kokoro
    RunId:
      name: runId
      in: path
      required: true
      description: Opaque asynchronous run identifier.
      schema:
        type: string
        minLength: 1
      example: run_01JASYNC
    ShareId:
      name: shareId
      in: path
      required: true
      description: Opaque public session share identifier.
      schema:
        type: string
        minLength: 1
      example: shr_01JSHARE
    DirectScopeQuery:
      name: scope
      in: query
      required: false
      description: On the Conversation collection, omitted or empty keeps the admitted owner's full visible set while direct restricts results to project_ref IS NULL. On resource routes it does not alter the existing project-bound authorization. It never overrides the admitted tenant and subject.
      schema:
        type: string
        enum: ['', direct]
      example: direct
    ShareScopeQuery:
      name: scope
      in: query
      required: false
      description: Optional public-share narrowing filter; it never grants private Chat access.
      schema:
        type: string
        minLength: 1
      example: ns_test
    ProjectRefQuery:
      name: project_ref
      in: query
      required: false
      description: Filter the Conversation collection to an owned project reference. A nonempty value cannot be combined with scope=direct on GET /v1/sessions; resource routes retain their existing project-bound authorization.
      schema:
        type: string
        minLength: 1
      example: project_kokoro
    TeamReadLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    TeamReadCursor:
      name: cursor
      in: query
      required: false
      description: Opaque IAM cursor bound to the admitted tenant and query.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of sessions to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        $ref: '#/components/schemas/Cursor'
      example: cur_01JNEXT
    CapabilityProviderKey:
      name: provider_key
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 191
    CapabilityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CapabilityCursor:
      name: cursor
      in: query
      required: false
      description: Opaque owner cursor; clients and the BFF must not parse or construct it.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Opaque BFF ledger cursor from the last delivered AG-UI frame; replay resumes strictly after it.
      schema:
        $ref: '#/components/schemas/EventCursor'
      example: agui_0123456789abcdef0123456789abcdef
    RenameProjectId:
      name: projectId
      in: path
      required: true
      description: Canonical Project ID only; existing GET by ID or slug is unchanged.
      schema:
        type: string
        pattern: '^project_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    RenameProjectIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Must occur exactly once; 1..128 printable ASCII characters excluding whitespace and comma, without trimming or merging.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]{1,128}$'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    MoriProjectRef:
      name: projectRef
      in: path
      required: true
      description: Opaque Mori music project reference.
      schema:
        type: string
        minLength: 1
      example: project_preview_first_light
    MoriGenerationRef:
      name: generationRef
      in: path
      required: true
      description: Opaque Mori generation reference.
      schema:
        type: string
        minLength: 1
      example: generation_mori_1
    MoriLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Mori generation event cursor; the stream resumes strictly after this id.
      schema:
        type: string
      example: generation_mori_1:2
    MoriCandidateRef:
      name: candidateRef
      in: path
      required: true
      description: Opaque Mori candidate reference.
      schema:
        type: string
        minLength: 1
      example: candidate_preview_first_light_a
    MoriVersionRef:
      name: versionRef
      in: path
      required: true
      description: Opaque immutable Mori version reference.
      schema:
        type: string
        minLength: 1
      example: version_preview_first_light_a
    MoriExportRef:
      name: exportRef
      in: path
      required: true
      description: Opaque Mori export reference.
      schema:
        type: string
        minLength: 1
      example: export_mori_1
    ScheduledTaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Platform:
      name: platform
      in: query
      required: true
      schema:
        type: string
