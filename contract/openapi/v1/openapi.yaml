      schema:
        type: string
        pattern: '^project_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])'
    ProjectDeletionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Must occur exactly once; 1..128 printable ASCII characters excluding whitespace and comma, without trimming or merging.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]{1,128}(?![\s\S])'
    SkillPackageInspectionSkillId:
      name: skill_id
      in: path
      required: true
      description: Exact managed personal Skill identifier; it is neither trimmed nor decoded twice.
      schema: { type: string, minLength: 1, maxLength: 191, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}(?![\s\S])' }
    SkillPackageInspectionInstallationId:
      name: installation_id
      in: path
      required: true
      description: Exact personal Skill installation identifier; it is neither trimmed nor decoded twice.
      schema: { type: string, minLength: 1, maxLength: 191, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}(?![\s\S])' }
    SkillPackageInspectionFilePath:
      name: file_path
      in: query
      required: false
      description: >-
        Optional safe ZIP member path, decoded once and preserved exactly. Runtime admission requires nonempty NFC Unicode whose UTF-8
        encoding is at most 256 bytes, rejects absolute or drive paths, empty/dot segments, backslash, NUL and a leading BOM, and does
        not trim or normalize a non-NFC value.
      schema: { type: string, minLength: 1 }
  schemas:
