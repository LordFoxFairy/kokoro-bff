        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items: { type: string, format: binary }
      responses:
        '200':
          description: CLEAN personal ASSET with a durable final Product receipt
          headers:
            x-request-id:
              schema: { type: string }
              description: Request correlation ID
            Cache-Control:
              schema: { type: string, const: no-store }
              description: Private uncached result
