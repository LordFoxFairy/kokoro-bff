            Referrer-Policy:
              schema: { type: string, const: no-referrer }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            '*/*':
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: IAM session admission is rate limited
          headers:
            Retry-After:
              description: Bounded delay in seconds before retrying admission
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: Storage metadata, reference or object bytes did not match the owner contract
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/library/artifacts/{conversation_id}/{artifact_id}:
    get:
      tags: [Library]
