components:
  securitySchemes:
    serviceHeader:
      type: apiKey
      in: header
      name: x-kokoro-service
    internalSecret:
      type: apiKey
      in: header
      name: x-kokoro-internal-secret
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Opaque chat session identifier.
      schema:
        type: string
        minLength: 1
      example: session_kokoro
    RunId:
      name: runId
      in: path
      required: true
      description: Opaque asynchronous run identifier.
      schema:
        type: string
        minLength: 1
      example: run_01JASYNC
    ShareId:
      name: shareId
      in: path
      required: true
      description: Opaque public session share identifier.
      schema:
        type: string
        minLength: 1
      example: shr_01JSHARE
    DirectScopeQuery:
      name: scope
      in: query
      required: false
      description: Private Chat filtering only; omitted, empty, or direct never overrides the admitted tenant and subject.
      schema:
        type: string
        enum: ['', direct]
      example: direct
    ShareScopeQuery:
      name: scope
      in: query
      required: false
      description: Optional public-share narrowing filter; it never grants private Chat access.
      schema:
        type: string
        minLength: 1
      example: ns_test
    ProjectRefQuery:
      name: project_ref
      in: query
      required: false
      description: Filter sessions to a project reference.
      schema:
        type: string
        minLength: 1
      example: project_kokoro
    TeamReadLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    TeamReadCursor:
      name: cursor
      in: query
      required: false
      description: Opaque IAM cursor bound to the admitted tenant and query.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of sessions to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        $ref: '#/components/schemas/Cursor'
      example: cur_01JNEXT
    CapabilitySkillQuery:
      name: query
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    CapabilitySkillTags:
      name: tags
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 128
      style: form
      explode: true
    CapabilitySkillScope:
      name: scope_kind
      in: query
      required: false
      schema:
        type: string
        enum: [personal, project, organization, session, '1', '2', '3', '4']
    CapabilityProviderKey:
      name: provider_key
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 191
    CapabilityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CapabilityCursor:
      name: cursor
      in: query
      required: false
      description: Opaque owner cursor; clients and the BFF must not parse or construct it.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Opaque BFF ledger cursor from the last delivered AG-UI frame; replay resumes strictly after it.
      schema:
        $ref: '#/components/schemas/EventCursor'
      example: agui_0123456789abcdef0123456789abcdef
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    MoriProjectRef:
      name: projectRef
      in: path
      required: true
      description: Opaque Mori music project reference.
      schema:
        type: string
        minLength: 1
      example: project_preview_first_light
    MoriGenerationRef:
      name: generationRef
      in: path
      required: true
      description: Opaque Mori generation reference.
      schema:
        type: string
        minLength: 1
      example: generation_mori_1
    MoriLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Mori generation event cursor; the stream resumes strictly after this id.
      schema:
        type: string
      example: generation_mori_1:2
    MoriCandidateRef:
      name: candidateRef
      in: path
      required: true
      description: Opaque Mori candidate reference.
      schema:
        type: string
        minLength: 1
      example: candidate_preview_first_light_a
    MoriVersionRef:
      name: versionRef
      in: path
      required: true
      description: Opaque immutable Mori version reference.
      schema:
        type: string
        minLength: 1
      example: version_preview_first_light_a
    MoriExportRef:
      name: exportRef
      in: path
      required: true
      description: Opaque Mori export reference.
      schema:
        type: string
        minLength: 1
      example: export_mori_1
    SkillName:
      name: skill
      in: path
      required: true
      schema:
        type: string
    SkillNameOnly:
      name: name
      in: path
      required: true
      schema:
        type: string
    SkillScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
    McpServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ScheduledTaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Platform:
      name: platform
      in: query
      required: true
      schema:
        type: string
        enum: [telegram, line, slack]
    SkillDraftIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Must occur exactly once. It is not trimmed or comma-joined.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    SkillPackageUploadSkillId:
      name: skill_id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
    SkillPackageBeginIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One printable 1–128 character value, never trimmed or comma-joined. Scoped to operation, admitted tenant/user and skill_id; changing request semantics with the same key conflicts.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    SkillPackageCompleteIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One printable 1–128 character value, never trimmed or comma-joined. Scoped to Complete, admitted tenant/user and skill_id; different command bytes under one key conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    SkillValidateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One printable 1–128 character value, never trimmed or comma-joined; scoped to validation operation, admitted tenant/user and skill_id.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    SkillPublishIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One printable 1–128 character value, never trimmed or comma-joined; scoped to publish operation, admitted tenant/user and skill_id. The body must have zero bytes.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    PublishedPersonalSkillId:
      name: skill_id
      in: path
      required: true
      description: Canonical Platform Skill identifier; never a source_ref, package asset, or installation identifier.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    CreateSkillDraftRequest:
      type: object
      required: [display_name, summary, tags]
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
          description: Runtime enforcement counts UTF-16 code units; OpenAPI maxLength alone is not the implementation rule.
        summary:
          type: string
          maxLength: 65535
          description: Runtime enforcement counts UTF-16 code units.
        tags:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '.*\S.*'
          description: Order is preserved and participates in the command digest; runtime lengths use UTF-16 code units.
    SkillDraftResource:
      type: object
      required: [skill_id, series_id, revision, status, replayed]
      additionalProperties: false
      properties:
        skill_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
        series_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
        revision: { type: integer, const: 1 }
        status: { type: string, enum: [draft] }
        replayed: { type: boolean }
    CreateSkillDraftResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/SkillDraftResource' }
    SkillDraftErrorDetail:
      type: object
      required: [code, message, retryable]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [invalid_skill_request, idempotency_key_required, invalid_idempotency_key, request_body_too_large, service_auth_failed, session_authentication_required, session_invalid, session_forbidden, session_rate_limited, product_tenant_not_configured, product_tenant_forbidden, skill_idempotency_conflict, skill_command_in_progress, skill_precondition_failed, skill_rate_limited, iam_admission_unavailable, skill_dependency_unavailable, skill_response_invalid]
        message: { type: string, minLength: 1 }
        retryable: { type: boolean }
    SkillDraftErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/SkillDraftErrorDetail' }
    SkillPackageUploadState:
      type: object
      required: [skill_id, attempt_epoch, phase]
      additionalProperties: false
      properties:
        skill_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
        attempt_epoch: { type: string }
        phase: { type: string, enum: [none, intent, upload_pending, uploaded, validated, aborted] }
        attempt_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
        upload_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
      oneOf:
        - properties:
            phase: { const: none }
            attempt_epoch: { const: '0' }
            attempt_id: false
            upload_id: false
        - required: [attempt_id]
          properties:
            phase: { const: intent }
            attempt_epoch: { $ref: '#/components/schemas/SkillPackageUploadPositiveEpoch' }
            attempt_id: { type: string }
            upload_id: false
        - required: [attempt_id, upload_id]
          properties:
            phase: { enum: [upload_pending, uploaded, validated] }
            attempt_epoch: { $ref: '#/components/schemas/SkillPackageUploadPositiveEpoch' }
            attempt_id: { type: string }
            upload_id: { type: string }
        - required: [attempt_id]
          properties:
            phase: { const: aborted }
            attempt_epoch: { $ref: '#/components/schemas/SkillPackageUploadPositiveEpoch' }
            attempt_id: { type: string }
    SkillPackageUploadPositiveEpoch:
      type: string
      description: Decimal unsigned 64-bit value from 1 through 18446744073709551615, without leading zeroes.
      pattern: '^(?:[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]{1}|1844674407370955161[0-4]|18446744073709551615)$'
    GetSkillPackageUploadResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/SkillPackageUploadState' }
    SkillPackageUploadGetErrorDetail:
      type: object
      required: [code, message, retryable]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [invalid_skill_request, service_auth_failed, session_authentication_required, session_invalid, session_forbidden, session_rate_limited, product_tenant_not_configured, product_tenant_forbidden, skill_not_found, skill_precondition_failed, skill_rate_limited, iam_admission_unavailable, skill_dependency_unavailable, skill_response_invalid]
        message: { type: string, minLength: 1 }
        retryable: { type: boolean }
    SkillPackageUploadGetErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { $ref: '#/components/schemas/SkillPackageUploadGetErrorDetail' }
    BeginSkillPackageUploadRequest:
      type: object
      required: [filename, mime_type, size_bytes, content_sha256]
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          x-maxUtf8: 255
          pattern: '^(?!\.{1,2}$)(?!\s)(?!.*\s$)[^/\\\u0000-\u001f\u007f]+$'
        mime_type: { type: string, const: application/zip }
        size_bytes: { type: integer, minimum: 1, maximum: 33554432 }
        content_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        replaces_attempt_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
    SkillPackageBeginTransferReference:
      type: object
      required: [url, method, required_headers, expires_at]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Short-lived signed ObjectStore public URL; the default-closed BFF candidate runtime matches an approved exact origin and rejects credentials and fragments. Browser PUT must reject redirects.
        method: { type: string, const: PUT }
        required_headers:
          type: object
          minProperties: 1
          maxProperties: 1
          propertyNames: { const: content-type }
          additionalProperties: { type: string, const: application/zip }
        expires_at: { type: string, format: date-time }
    SkillPackageBeginResource:
      type: object
      required: [skill_id, attempt_id, attempt_epoch, upload_id, transfer_reference, replayed]
      additionalProperties: false
      properties:
        skill_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
        attempt_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
        attempt_epoch: { $ref: '#/components/schemas/SkillPackageUploadPositiveEpoch' }
        upload_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
        transfer_reference: { $ref: '#/components/schemas/SkillPackageBeginTransferReference' }
        replayed: { type: boolean }
    BeginSkillPackageUploadResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data: { $ref: '#/components/schemas/SkillPackageBeginResource' }
    SkillPackageBeginErrorDetail:
      type: object
