  /v1/projects/{projectId}/resources:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectResources
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: project.resource.read
      summary: List clean project resources
      description: Current project ownership is checked on every page. Storage filters ASSET and CLEAN before pagination; ordering is created_at descending then asset_id ascending, without snapshot isolation. Cursor is opaque and bound to trusted scope, subject and limit. No upload ID or download URL is returned.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: Current project resource page; an empty project returns an empty items array
          headers:
            x-request-id:
              schema: { type: string }
              description: Request correlation ID
            Cache-Control:
              schema: { type: string, const: no-store }
              description: Private uncached page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResourceListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: IAM session admission is rate limited
          headers:
            Retry-After:
              description: Bounded admission retry delay in seconds
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: Invalid Storage page or unexpected owner response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Projects]
      operationId: uploadProjectResources
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: required
      x-kokoro-permission: project.resource.create
      summary: Upload one project resource
      description: Exactly one files part. Entire multipart body must not exceed 1048576 bytes. Only a CLEAN asset is returned as success; infected files receive terminal 422 resource_file_infected. Pending or unknown scans receive retryable 503 resource_scan_pending; retry the same key to recheck the existing asset. Reuse the same idempotency key and identical file to recover an uncertain result.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              additionalProperties: false
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: File completed by Storage and durable BFF receipt recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResourceUploadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '429':
          description: IAM session admission is rate limited
          headers:
            Retry-After:
              description: Bounded delay in seconds before retrying admission
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: Infected file rejected (resource_file_infected); terminal result, do not retry this upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: Multipart body exceeds 1 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: Invalid Storage response or transfer reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
