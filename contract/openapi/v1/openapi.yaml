          additionalProperties: false
          properties:
            organization: { type: array, minItems: 1, items: { type: string, enum: [update] } }
            member: { type: array, minItems: 1, items: { type: string, enum: [create, read, update, delete] } }
            invitation: { type: array, minItems: 1, items: { type: string, enum: [create, read, cancel] } }
            ac: { type: array, minItems: 1, items: { type: string, enum: [create, read, update] } }
            tenant: { type: array, minItems: 1, items: { type: string, enum: [read] } }
