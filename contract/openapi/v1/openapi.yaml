        - name: artifact_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
      responses:
        '200':
          description: Current FINAL CLEAN Artifact metadata after BFF owner and Storage revalidation
          headers:
            x-request-id:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryArtifactResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: IAM session admission is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/library/artifacts/{conversation_id}/{artifact_id}/content:
    get:
      tags: [Library]
      operationId: downloadLibraryArtifact
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: storage.library.read
      summary: Download the original verified bytes of one private delivered Artifact
      description: The BFF admits at most two concurrent private Artifact spools per process. A third request fails before ObjectStore fetch with 503 artifact_download_busy; a slot is held through response completion or cancellation and then released.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
        - name: artifact_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 191 }
      responses:
        '200':
          description: Complete original bytes, verified before headers and bounded to 1 GiB
          headers:
            x-request-id:
              schema: { type: string }
            Content-Type:
              schema: { type: string }
            Content-Length:
              schema: { type: integer, minimum: 0, maximum: 1073741824 }
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            '*/*':
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: IAM session admission is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: Storage unavailable or both Artifact spool slots busy (artifact_download_busy)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
