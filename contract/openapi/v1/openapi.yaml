  /v1/connector.list:
    get:
      tags: [MCP]
      operationId: listConnectors
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: product.mcp.read_personal
      summary: List the current caller's installed connectors
      description: Manus-compatible public projection. Identity is derived from the caller session; this endpoint accepts no query parameters or request body. Only active installed connectors are returned, with one owner-provided category each.
      responses:
        '200':
          description: Current caller connector list
          headers:
            x-request-id:
              required: true
              schema: { type: string, minLength: 1, maxLength: 128 }
            cache-control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, request_id, data]
                properties:
                  ok: { type: boolean, const: true }
                  request_id: { type: string, minLength: 1, maxLength: 128 }
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, type, description, category]
                      properties:
                        id: { type: string, minLength: 1, maxLength: 191 }
                        name: { type: string, minLength: 1, maxLength: 100 }
                        type: { type: string, enum: [builtin, byok, mcp] }
                        description: { type: string, minLength: 1, maxLength: 1000 }
                        category: { type: string, minLength: 1, maxLength: 128 }
        '400': { $ref: '#/components/responses/ConnectorListInvalidArgument' }
        '401': { $ref: '#/components/responses/ConnectorListUnauthenticated' }
        '403': { $ref: '#/components/responses/ConnectorListPermissionDenied' }
        '429': { $ref: '#/components/responses/ConnectorListUnavailable' }
        '502': { $ref: '#/components/responses/ConnectorListInvalidOwnerResponse' }
        '503': { $ref: '#/components/responses/ConnectorListUnavailable' }
  /v1/mcp/connections:
