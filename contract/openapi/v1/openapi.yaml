      operationId: uploadLibraryFile
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: required
      x-kokoro-permission: storage.library.write
      summary: Upload one personal library file
      description: Exactly one files part and at most 1048576 bytes for the entire multipart body. The raw Idempotency-Key must be a unique 1-191 character printable ASCII value without comma or surrounding whitespace. The admitted subject's personal Storage scope is used. Only a CLEAN ordinary ASSET is returned as success. Reuse the same key and identical file after an uncertain result; infected content is terminal.
