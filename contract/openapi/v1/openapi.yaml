      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items: { type: string, format: binary }
      responses:
