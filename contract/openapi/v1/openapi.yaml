        '403': { $ref: '#/components/responses/SkillPackageInspectionForbidden' }
        '404': { $ref: '#/components/responses/SkillPackageInspectionNotFound' }
        '412': { $ref: '#/components/responses/SkillPackageInspectionPreconditionFailed' }
        '429': { $ref: '#/components/responses/SkillPackageInspectionRateLimited' }
