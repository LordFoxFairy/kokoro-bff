    SkillInstallation:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - source_ref
        - series_id
        - revision
        - installed
        - enabled
        - installed_at
        - updated_at
        - display_name
        - summary
        - source_status
        - skill_updated_at
        - example_prompts
        - category_keys
        - product
        - tags
      properties:
        example_prompts:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 1000
            pattern: \S
          description: >-
            Ordered original strings; duplicates preserved. Each item has 1-1000 Unicode scalar values; reject unpaired surrogates, U+0000 and ECMAScript trim
            whitespace-only strings. Combined UTF-8 size is at most 16384 bytes. Empty arrays are valid; null is invalid.
        installation_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$
        source_ref:
          type: string
          pattern: ^skill:(?!skill:)[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$
        series_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$
        revision:
          type: string
          pattern: >-
            ^(?:[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{9}|1844674407[0-2][0-9]{8}|18446744073[0-6][0-9]{7}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|1844674407370955[0-0][0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-5])$
        installed:
          type: boolean
        enabled:
          type: boolean
        installed_at:
          type: string
          format: date-time
          pattern: Z$
        updated_at:
          type: string
          format: date-time
          pattern: Z$
        skill_updated_at:
          type: string
          format: date-time
          pattern: Z$
        removed_at:
          type: string
          format: date-time
          pattern: Z$
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        summary:
          type: string
          maxLength: 65535
        source_status:
          type: string
          enum:
            - active
            - disabled
            - withdrawn
            - quarantined
        category_keys:
          $ref: "#/components/schemas/SkillProductCategoryKeys"
        product:
          $ref: "#/components/schemas/Public9SkillProductFacts"
        publisher_profile:
          $ref: "#/components/schemas/SkillPublisherProfile"
        available_update:
          type: object
          additionalProperties: false
          required:
            - source_ref
            - revision
          properties:
            source_ref:
              type: string
              pattern: ^skill:[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$
            revision:
              type: string
              pattern: ^[1-9][0-9]*$
              maxLength: 20
        tags:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: .*\S.*
          description: Order is preserved and participates in the command digest; runtime lengths use UTF-16 code units.
    SkillInstallationMutation:
      type: object
      additionalProperties: false
      required: [installation, change, replayed]
      properties:
        installation: { $ref: "#/components/schemas/SkillInstallation" }
        change:
          {
            type: string,
            enum:
              [
                installed,
                upgraded,
                reinstalled,
                enabled,
                disabled,
                removed,
                unchanged,
              ],
          }
        event_id: { type: string, minLength: 1, maxLength: 191 }
        replayed: { type: boolean }
    SkillInstallationListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          {
            type: array,
            items: { $ref: "#/components/schemas/SkillInstallation" },
          }
        meta:
          type: object
          additionalProperties: false
          required: [next_cursor]
          properties:
            { next_cursor: { type: string, minLength: 1, maxLength: 4096 } }
    SkillInstallationErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string, minLength: 1, maxLength: 128 }
            message: { type: string, minLength: 1, maxLength: 1024 }
            retryable: { type: boolean }
    CreatePersonalSkillVersionRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
        - summary
        - tags
      properties:
        example_prompts:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 1000
            pattern: \S
          description: >-
            Ordered original strings; duplicates preserved. Each item has 1-1000 Unicode scalar values; reject unpaired surrogates, U+0000 and ECMAScript trim
            whitespace-only strings. Combined UTF-8 size is at most 16384 bytes. Empty arrays are valid; null is invalid.
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: .*\S.*
          description: Runtime enforcement counts UTF-16 code units; OpenAPI maxLength alone is not the implementation rule.
        summary:
          type: string
          maxLength: 65535
          description: Runtime enforcement counts UTF-16 code units.
        tags:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: .*\S.*
          description: Order is preserved and participates in the command digest; runtime lengths use UTF-16 code units.
        category_keys:
          $ref: "#/components/schemas/SkillProductCategoryKeys"
    CreatePersonalSkillVersionResource:
      type: object
      additionalProperties: false
      required:
        - skill_id
        - series_id
        - revision
        - status
        - replayed
        - state_version
      properties:
        skill_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$
        series_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$
        revision:
          type: string
          pattern: >-
            ^(?!(?:0|1)$)(?:[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-4]|18446744073709551615)$
        status:
          type: string
          const: draft
        replayed:
          type: boolean
        state_version:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
          description: Canonical positive decimal; runtime bounds to signed 64-bit maximum 9223372036854775807.
    CreatePersonalSkillVersionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
