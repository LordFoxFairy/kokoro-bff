          description: CLEAN personal ASSET with a durable final Product receipt
          headers:
            x-request-id:
              schema: { type: string }
              description: Request correlation ID
            Cache-Control:
              schema: { type: string, const: no-store }
              description: Private uncached result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalFileUploadResponse' }
