openapi: 3.1.0
info:
  title: Kokoro Business API
  version: 16.0.0
  description: Kokoro BFF 面向 Web 的业务契约；阶段 1 仅通过 PostgreSQL + Redis 及显式 HTTP upstream/adapter 契约协作，不新增 MySQL/Mongo 依赖。
  license:
    name: Proprietary Kokoro contract
    url: https://kokoro.invalid/license
servers:
  - url: http://127.0.0.1:4300
    description: Local mock BFF
  - url: https://bff.kokoro.invalid
    description: Production placeholder
security:
  - serviceHeader: []
    internalSecret: []
    userBearer: []
tags:
  - name: Personalization
    description: Caller-owned personal fields with explicit conditional saving.
  - name: Health
    description: Process and dependency health probes.
  - name: Identity
    description: Current IAM-admitted Product identity projections.
  - name: System
    description: Tenant-scoped runtime manifest projection.
  - name: Projects
    description: BFF-owned projects and project resources.
  - name: Mori Music
    description: Provider-neutral music creation projections and generation events.
  - name: Team
    description: Current-tenant membership, invitation and role projections backed by IAM.
  - name: Chat
    description: Asynchronous sessions, messages, event streams, and run controls.
  - name: Models
    description: Tenant-visible model candidates.
  - name: Skills
    description: Skill catalog, revisions, quotas, and lifecycle operations.
  - name: MCP
    description: MCP discovery projections; browser-private connector lifecycle is separately scoped.
  - name: Scheduled
    description: BFF-owned scheduled task definitions.
  - name: Agents
    description: Agent connection setup projections.
  - name: Library
    description: BFF Library surface pending the Storage v2 integration.
  - name: Billing
    description: Billing catalog, summary, and checkout projections.
  - name: Administration
    description: Platform-administrator projections backed by their owning services.
paths:
  /v1/preferences/personalization:
    get:
      tags: [Personalization]
      operationId: getSelfPersonalization
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: personalization.self.read
      summary: Read current caller personalization
      description: No query or identity selectors. No request body; absent is null with revision zero and never creates a row.
      responses:
        '200': { $ref: '#/components/responses/PersonalizationReadSuccess' }
        '400': { $ref: '#/components/responses/PersonalizationBadRequest' }
        '401': { $ref: '#/components/responses/PersonalizationUnauthorized' }
        '403': { $ref: '#/components/responses/PersonalizationForbidden' }
        '405': { $ref: '#/components/responses/PersonalizationMethodNotAllowed' }
        '429': { $ref: '#/components/responses/PersonalizationRateLimited' }
        '503': { $ref: '#/components/responses/PersonalizationUnavailable' }
    put:
      tags: [Personalization]
      operationId: replaceSelfPersonalization
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: personalization.self.write
      summary: Conditionally replace current caller personalization
      description: No query or identity selectors. Required expected_revision CAS; stale writes conflict. No automatic mutation retry or Idempotency-Key receipt. A lost ACK requires a fresh GET; an old read does not prove an in-flight COMMIT failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceSelfPersonalizationRequest' }
      responses:
        '200': { $ref: '#/components/responses/PersonalizationSaveSuccess' }
        '400': { $ref: '#/components/responses/PersonalizationBadRequest' }
        '401': { $ref: '#/components/responses/PersonalizationUnauthorized' }
        '403': { $ref: '#/components/responses/PersonalizationForbidden' }
        '405': { $ref: '#/components/responses/PersonalizationMethodNotAllowed' }
        '409': { $ref: '#/components/responses/PersonalizationConflict' }
        '413': { $ref: '#/components/responses/PersonalizationPayloadTooLarge' }
        '429': { $ref: '#/components/responses/PersonalizationRateLimited' }
        '503': { $ref: '#/components/responses/PersonalizationUnavailable' }
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: anonymous
      summary: Check process health
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid probe request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: anonymous
      summary: Check service readiness
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Required upstreams are not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          description: Invalid probe request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/system/runtime-manifest:
    get:
      tags: [System]
      operationId: getRuntimeManifest
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: system.runtime_manifest.read
      summary: Get the tenant runtime manifest
      description: Uses the server-configured tenant and domain to load the System owner manifest; System validates its own Site/Host binding before the BFF projects the resource fields once into the v1 snake_case transport.
      parameters:
        - name: product_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: locale
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: surface_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      security:
        - serviceHeader: []
          internalSecret: []
      responses:
        '200':
          description: Server-configured tenant runtime manifest; System validates the configured tenant with Forwarded host against its own Site/Host binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeManifestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '502':
          description: System owner transport/contract failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: System owner is not configured or unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: identity.self.read
      summary: Get the current Product user and fixed tenant
      description: The trusted Web service and unique user Bearer are verified online through IAM; the admitted tenant must equal the server-configured Product tenant. No caller-supplied tenant or user field is used.
      responses:
        '200':
          description: Current IAM-admitted identity
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '429':
          description: IAM admission is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/team/members:
    get:
      tags: [Team]
      operationId: listTeamMembers
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.member.read
      summary: List current-tenant members through IAM
      parameters:
        - $ref: '#/components/parameters/TeamReadLimit'
        - $ref: '#/components/parameters/TeamReadCursor'
      responses:
        '200':
          description: Current-tenant members page
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMembersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: IAM admission or Team read is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/team/invitations:
    get:
      tags: [Team]
      operationId: listTeamInvitations
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.invitation.read
      summary: List current-tenant invitations through IAM
      parameters:
        - $ref: '#/components/parameters/TeamReadLimit'
        - $ref: '#/components/parameters/TeamReadCursor'
      responses:
        '200':
          description: Current-tenant invitations page
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamInvitationsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: IAM admission or Team read is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Team]
      operationId: createTeamInvitation
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.invitation.write
      summary: Create invitation in the admitted tenant
      description: IAM owns the mutation; no receipt or automatic retry is available for an uncertain result.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamCreateInvitationRequest' }
      responses:
        '200':
          description: IAM owner mutation result
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPendingInvitationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: IAM admission or Team mutation is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/team/roles:
    get:
      tags: [Team]
      operationId: listTeamRoles
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.role.read
      summary: List current-tenant roles through IAM
      parameters:
        - $ref: '#/components/parameters/TeamReadLimit'
        - $ref: '#/components/parameters/TeamReadCursor'
      responses:
        '200':
          description: Current-tenant roles page
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamRolesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: IAM admission or Team read is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/team/invitations/{invitation_id}/resend:
    post:
      tags: [Team]
      operationId: resendTeamInvitation
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.invitation.write
      summary: Resend a pending invitation
      description: IAM owns the mutation; no receipt or automatic retry is available for an uncertain result.
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: IAM owner mutation result
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPendingInvitationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: IAM admission or Team mutation is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/team/invitations/{invitation_id}:
    delete:
      tags: [Team]
      operationId: cancelTeamInvitation
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.invitation.write
      summary: Cancel a pending invitation
      description: IAM owns the mutation; no receipt or automatic retry is available for an uncertain result.
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: IAM owner mutation result
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamCanceledInvitationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: IAM admission or Team mutation is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/team/members/me:
    delete:
      tags: [Team]
      operationId: leaveTeam
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.member.write
      summary: Leave the admitted tenant
      description: IAM owns the mutation; no receipt or automatic retry is available for an uncertain result.
      responses:
        '200':
          description: IAM owner mutation result
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamLeftMemberResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: IAM admission or Team mutation is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/team/members/{member_id}/roles:
    put:
      tags: [Team]
      operationId: replaceTeamMemberRoles
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.member.write
      summary: Replace member roles
      description: IAM owns the mutation; no receipt or automatic retry is available for an uncertain result.
      parameters:
        - name: member_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamReplaceRolesRequest' }
      responses:
        '200':
          description: IAM owner mutation result
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamRolesChangedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: IAM admission or Team mutation is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/team/members/{member_id}:
    delete:
      tags: [Team]
      operationId: removeTeamMember
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: team.member.write
      summary: Remove a member
      description: IAM owns the mutation; no receipt or automatic retry is available for an uncertain result.
      parameters:
        - name: member_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200':
          description: IAM owner mutation result
          headers:
            x-request-id:
              schema: { $ref: '#/components/schemas/RequestId' }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamRemovedMemberResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: IAM admission or Team mutation is rate limited
          headers:
            Retry-After:
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/sessions:
    get:
      tags: [Chat]
      operationId: listSessions
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: chat.session.read
      summary: List chat sessions
      description: Omitted or empty scope lists every active Conversation visible to the admitted tenant and subject. Explicit scope=direct lists only Conversations without a project_ref. A nonempty project_ref lists only that owned Project. scope=direct and a nonempty project_ref are mutually exclusive and return invalid_scope before Project lookup. Changing any filter requires discarding the previous cursor and starting from the first page.
      parameters:
        - $ref: '#/components/parameters/DirectScopeQuery'
        - $ref: '#/components/parameters/ProjectRefQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ServiceAuthFailed' }
        '403': { $ref: '#/components/responses/ServiceAuthFailed' }
        '429':
          description: IAM session admission is rate limited
          headers:
            Retry-After:
              description: Bounded delay in seconds before retrying admission
              schema: { type: string, pattern: '^[1-9][0-9]{0,4}$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/admin/identity/members:
    get:
      tags: [Administration]
      operationId: listAdminIdentityMembers
      summary: List current-tenant members for platform administration
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: admin.identity.read
      parameters:
        - $ref: '#/components/parameters/AdminIdentityLimit'
        - $ref: '#/components/parameters/AdminIdentityCursor'
      responses:
        '200':
