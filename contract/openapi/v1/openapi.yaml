      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: public
      x-kokoro-stability: beta
      x-kokoro-idempotency: none
      x-kokoro-permission: capability.mcp.read
      summary: List current-person active MCP connections
      description: Only current-person eligible connections; this read does not grant invocation. Duplicate, unknown, empty and malformed query values are rejected. Cursor is opaque and bound to the current tenant, subject and filters; each page rechecks current eligibility.
      parameters:
        - in: query
          name: connection_id
          required: false
          schema: { type: string, minLength: 1, maxLength: 191, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
        - $ref: '#/components/parameters/CapabilityProviderKey'
        - $ref: '#/components/parameters/CapabilityLimit'
        - $ref: '#/components/parameters/CapabilityCursor'
      responses:
        '200':
          description: Current-person active MCP connection list
          headers:
            x-request-id:
              required: true
              schema: { type: string, minLength: 1, maxLength: 128 }
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConnectionListResponse'
