        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    SkillPackageCompleteIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One printable 1–128 character value, never trimmed or comma-joined. Scoped to Complete, admitted tenant/user and skill_id; different command bytes under one key conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    SkillValidateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One printable 1–128 character value, never trimmed or comma-joined; scoped to validation operation, admitted tenant/user and skill_id.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    SkillPublishIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One printable 1–128 character value, never trimmed or comma-joined; scoped to publish operation, admitted tenant/user and skill_id. The body must have zero bytes.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    MoveSessionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly once; one printable 1–128 character value, never trimmed or comma-joined.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    SpecificationSkillInstallationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one printable 1-128 character value; values are neither trimmed nor comma-joined.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]+$'
    PersonalSkillLifecycleSkillId:
      name: skill_id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,190}$' }
    CreatePersonalSkillVersionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x2B\x2D-\x7E]+$' }
    WithdrawPersonalSkillIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x2B\x2D-\x7E]+$' }
    ProjectDeletionId:
      name: projectId
      in: path
      required: true
