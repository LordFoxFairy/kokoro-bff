      required:
        - ok
        - request_id
        - data
      properties:
        ok:
          type: boolean
        request_id:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SpecificationPublicSkill"
    SpecificationPublicError:
      type: object
      additionalProperties: false
      required:
        - ok
        - request_id
        - error
      properties:
        ok:
          type: boolean
        request_id:
          type: string
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    SpecificationBrowserError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
    McpProviderAdminOrigin:
      type: object
      additionalProperties: false
      required: [scheme, host, port, path_prefix]
      properties:
        scheme: { type: string, enum: [http, https] }
        host: { type: string, minLength: 1, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        path_prefix: { type: string, minLength: 1, maxLength: 2048, pattern: '^/' }
    McpProviderAdminInput:
      type: object
      additionalProperties: false
      required: [provider_key, display_name, directory_type, category_keys, example_prompts, connector_types, default_scopes, authorization_required, allowed_mcp_origins]
      properties:
        provider_key: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        directory_type: { type: string, enum: [app, data_source] }
        category_keys: { type: array, maxItems: 16, items: { type: string, enum: [efficiency, creation, business, development, finance, travel, health] }, uniqueItems: true }
        example_prompts: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 1000 } }
        author: { type: string, minLength: 1, maxLength: 100 }
        website: { type: string, format: uri, pattern: '^https://' }
        privacy_url: { type: string, format: uri, pattern: '^https://' }
        cover_image_url: { type: string, format: uri, pattern: '^https://' }
        connector_types: { type: array, minItems: 1, maxItems: 3, items: { type: string, enum: [builtin, byok, mcp] }, uniqueItems: true }
        default_scopes: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 128 }, uniqueItems: true }
        authorization_required: { type: boolean }
        allowed_mcp_origins: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/McpProviderAdminOrigin' } }
        tool_authorization_policy:
